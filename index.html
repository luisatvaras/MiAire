<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Monterrey Air Quality — Digital Twin</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" />
    <link rel="stylesheet" href="https://api.mapbox.com/mapbox-gl-js/v3.26.0/mapbox-gl.css" />
    <script src="https://api.mapbox.com/mapbox-gl-js/v3.26.0/mapbox-gl.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.149.0/build/three.min.js"></script>
    <style>
/* ---------------------------------------------------------------------------
   TODOS los colores de la interfaz (panel, leyenda, popups) viven aquí abajo.
   Cambia un valor y se refleja en toda la página. Los colores del MAPA
   (calles, agua, edificios, AQI) están en src/colors.js, no aquí.
--------------------------------------------------------------------------- */
:root {
  --body-bg: #0b0e14;
  --panel-bg: rgba(15, 18, 26, 0.85);
  --panel-border: rgba(255, 255, 255, 0.08);
  --panel-shadow: rgba(0, 0, 0, 0.35);
  --text-primary: #eef1f6;
  --text-subtitle: #9aa5b6;
  --text-legend: #cbd3e0;
  --text-status: #7d8aa0;
  --popup-bg: #12151d;
  --space-neutral: #f4f4f4; /* fondo del espacio antes de "Mi ubicación" */
  --intro-text: #1c1f26;
  --intro-accent: #2a6ac2; /* azul de los botones de la intro */
}

html, body {
  margin: 0;
  padding: 0;
  height: 100%;
  width: 100%;
  font-family: "Manrope", system-ui, -apple-system, sans-serif;
  background: var(--body-bg);
}

#map {
  position: absolute;
  inset: 0;
  background: var(--space-neutral);
  transition: background-color 1.2s ease; /* el espacio se tiñe suave al ubicarte */
}

/* --- Pantalla de inicio ("MiAire", debajo del planeta) ------------------- */
#intro {
  position: absolute;
  left: 50%;
  bottom: 7%;
  transform: translateX(-50%);
  z-index: 2;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 12px;
  color: var(--intro-text);
  transition: opacity 0.6s ease;
}
#intro.hidden {
  opacity: 0;
  pointer-events: none;
}
.intro-logo {
  width: 320px;
  max-width: 80vw;
  height: auto;
  margin-bottom: 4px;
}
/* Aviso de la intro: "Haz clic para…" (cada paso avanza con un clic) */
#step-hint {
  position: absolute;
  left: 50%;
  bottom: 22px;
  transform: translateX(-50%);
  z-index: 3;
  margin: 0;
  padding: 8px 16px;
  font-size: 13px;
  font-weight: 600;
  color: var(--intro-accent);
  background: rgba(255, 255, 255, 0.85);
  border-radius: 999px;
  pointer-events: none;
  opacity: 0;
  transition: opacity 0.6s ease;
}
#step-hint.visible {
  opacity: 1;
  animation: intro-pulse 1.8s ease-in-out infinite;
}
@keyframes intro-pulse {
  50% { opacity: 0.55; }
}
.intro-select,
.intro-button {
  width: 220px;
  padding: 10px 14px;
  font-family: inherit;
  font-size: 14px;
  font-weight: 600;
  border-radius: 999px;
  cursor: pointer;
}
.intro-select {
  color: var(--intro-accent);
  background: rgba(255, 255, 255, 0.9);
  border: 1.5px solid var(--intro-accent);
  text-align: center;
}
/* Botón "Mi ubicación": la imagen FIGURAS/miaire_botones.svg; al presionarlo
   pasa a mostrar el estado como texto en una pastilla del mismo azul. */
.intro-button {
  height: 54px; /* = alto de la imagen a 220px de ancho, para que no "brinque" al cambiar a texto */
  color: #ffffff;
  background: var(--intro-accent);
  border: none;
}
/* Ícono de ubicación en "Ubicación encontrada" (mismo trazo que el SVG del botón) */
.intro-button {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
}
.intro-pin {
  width: 14px;
  height: auto;
  fill: none;
  stroke: #eef7ff;
  stroke-width: 1.4px;
}
.intro-button--image {
  padding: 0;
  background: none;
}
.intro-button--image img {
  display: block;
  width: 100%;
  height: auto;
}
.intro-button--image:hover img {
  filter: brightness(1.08);
}
.intro-button:disabled {
  opacity: 0.9;
  cursor: progress;
}

/* El panel aparece al terminar la intro (pasa a 3D) */
#panel {
  transition: opacity 0.6s ease;
}
#panel.hidden {
  opacity: 0;
  pointer-events: none;
}

#magnifier {
  position: fixed;
  width: 150px;
  height: 150px;
  border-radius: 50%;
  overflow: hidden;
  pointer-events: none;
  /* visibility, no display:none — Mapbox necesita medir el tamaño del
     contenedor incluso mientras está oculta, si no el mini-mapa dentro
     queda mal dimensionado la primera vez que se muestra. */
  visibility: hidden;
  z-index: 5;
  border: 3px solid rgba(255, 255, 255, 0.9);
  box-shadow: 0 2px 8px rgba(0, 0, 0, 0.35);
}

/* El círculo es tan chico que el logo de Mapbox (esquina inferior) no
   queda bien recortado por el overflow:hidden de arriba y se asoma como
   una caja oscura — lo ocultamos solo en la lupa, no en el mapa principal. */
#magnifier .mapboxgl-ctrl-logo,
#magnifier .mapboxgl-ctrl-bottom-left,
#magnifier .mapboxgl-ctrl-bottom-right {
  display: none !important;
}

/* Número + calificación de AQI flotando sobre la nube 3D — su posición se
   recalcula cada frame en render() (proyectando su posición 3D a pantalla),
   así que solo left/top/display cambian por JS; el resto es estático. */
#cloud-label {
  position: fixed;
  display: none;
  transform: translate(-50%, -50%); /* centrado en el punto, no colgando arriba — así cae dentro de la nube */
  pointer-events: none;
  z-index: 4;
  text-align: center;
  font-family: inherit;
  color: #ffffff;
}

#cloud-label-value {
  font-size: 26px;
  font-weight: 700;
  line-height: 1;
}

#cloud-label-text {
  font-size: 12px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.03em;
}

#panel {
  position: absolute;
  top: 16px;
  left: 16px;
  z-index: 1;
  background: var(--panel-bg);
  backdrop-filter: blur(8px);
  border: 1px solid var(--panel-border);
  border-radius: 12px;
  padding: 16px 20px;
  color: var(--text-primary);
  width: 260px;
  box-shadow: 0 8px 24px var(--panel-shadow);
}

#panel h1 {
  margin: 0;
  font-size: 16px;
  font-weight: 600;
}

.subtitle {
  margin: 2px 0 12px;
  font-size: 12px;
  color: var(--text-subtitle);
}

.toggle-btn {
  display: block;
  width: 100%;
  margin-bottom: 8px;
  padding: 6px 10px;
  font-size: 12px;
  font-family: inherit;
  font-weight: 600;
  color: var(--text-primary);
  background: rgba(255, 255, 255, 0.06);
  border: 1px solid var(--panel-border);
  border-radius: 6px;
  cursor: pointer;
}

.toggle-btn:last-of-type {
  margin-bottom: 12px;
}

.toggle-btn:hover {
  background: rgba(255, 255, 255, 0.12);
}

/* Botón encendido / modo elegido */
.toggle-btn.active {
  background: rgba(255, 255, 255, 0.88);
  color: #11141b;
  border-color: transparent;
}

/* Título de cada grupo de botones del panel */
.control-label {
  margin: 12px 0 6px;
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--text-subtitle);
}

/* Grupo de botones en rejilla de 2 columnas */
.mode-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 6px;
}
.mode-grid.last {
  margin-bottom: 12px;
}
.mode-grid .toggle-btn {
  margin: 0;
  padding: 6px 4px;
  line-height: 1.25;
}

#legend {
  display: flex;
  flex-direction: column;
  gap: 6px;
  margin-bottom: 12px;
}

.legend-row {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 12px;
  color: var(--text-legend);
}

.legend-swatch {
  width: 12px;
  height: 12px;
  border-radius: 3px;
  flex: none;
}

#metro-legend {
  margin-bottom: 12px;
}

.metro-legend-row {
  font-size: 12px;
}

.metro-legend-logo {
  width: 20px;
  height: 20px;
  flex: none;
}

#status {
  font-size: 11px;
  color: var(--text-status);
  border-top: 1px solid var(--panel-border);
  padding-top: 8px;
}

.sensor-popup {
  font-family: inherit;
}

.sensor-popup h3 {
  margin: 0;
  font-size: 14px;
  text-align: center;
}

.sensor-popup .aqi-value {
  font-size: 22px;
  font-weight: 700;
}

.sensor-popup .aqi-label {
  font-size: 12px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.03em;
}

.mapboxgl-popup-content {
  background: var(--popup-bg) !important;
  color: var(--text-primary) !important;
  border-radius: 10px !important;
  /* Mapbox trae padding asimétrico por defecto (más abajo, para el botón
     de cerrar) — como no usamos ese botón, lo dejamos parejo. */
  padding: 10px 14px !important;
  /* Mapbox por defecto limita el popup a max-width:240px con ancho fijo —
     esto lo deja ajustarse al texto (nombres cortos quedan angostos,
     largos se envuelven en vez de forzar una caja ancha vacía). */
  width: max-content !important;
  max-width: 240px !important;
}

.mapboxgl-popup-tip {
  border-top-color: var(--popup-bg) !important;
  border-bottom-color: var(--popup-bg) !important;
}

/* Popups y controles de Mapbox también en Manrope (Mapbox trae su propia fuente) */
.mapboxgl-map,
.mapboxgl-popup-content {
  font-family: "Manrope", system-ui, -apple-system, sans-serif;
}

    </style>

const COLUMN_GRADIENT = ["#00CE93", "#FAC131", "#E4283F", "#A52A8B"];

// ===== aqi.js =====

// Colores centralizados en colors.js — edítalos ahí.

function levelForAqi(aqi) {
  return AQI_LEVELS.find((level) => aqi <= level.max) ?? AQI_LEVELS.at(-1);
}

// Mapbox expression: interpolates the ground halo color by AQI, using the
// same 4 stops as the vertical column gradient (COLUMN_GRADIENT).
function aqiGradientExpression() {
  const [good, moderate, bad, hazardous] = COLUMN_GRADIENT;
  return [
    "interpolate",
    ["linear"],
    ["get", "aqi"],
    0, good,
    100, moderate,
    200, bad,
    300, hazardous,
  ];
}

// Fraction (0-1) of the AQI scale, capped at 300 — shared by column height
// and column gradient so a short (low-AQI) column only samples the green
// end of COLUMN_GRADIENT, while a maxed-out column spans the full gradient.
function fractionForAqi(aqi) {
  return Math.min(aqi, 300) / 300;
}

// Column height (meters) scaled by AQI, capped for visual sanity.
function heightForAqi(aqi) {
  return fractionForAqi(aqi) * 1800;
}

function hexToRgb(hex) {
  const int = parseInt(hex.replace("#", ""), 16);
  return [(int >> 16) & 255, (int >> 8) & 255, int & 255];
}

function rgbToHex([r, g, b]) {
  return "#" + [r, g, b].map((c) => Math.round(c).toString(16).padStart(2, "0")).join("");
}

// Interpolates a color across COLUMN_GRADIENT's stops at position t (0-1).
function gradientColorAt(t) {
  const clamped = Math.max(0, Math.min(1, t));
  const segment = 1 / (COLUMN_GRADIENT.length - 1);
  const i = Math.min(COLUMN_GRADIENT.length - 2, Math.floor(clamped / segment));
  const localT = (clamped - i * segment) / segment;
  const a = hexToRgb(COLUMN_GRADIENT[i]);
  const b = hexToRgb(COLUMN_GRADIENT[i + 1]);
  return rgbToHex(a.map((channel, idx) => channel + (b[idx] - channel) * localT));
}

// Same as gradientColorAt but returns normalized [r, g, b] (0-1 floats) —
// what WebGL/Three.js vertex colors expect, straight from the interpolated
// hex without an extra string round-trip.
function gradientRgbAt(t) {
  const [r, g, b] = hexToRgb(gradientColorAt(t));
  return [r / 255, g / 255, b / 255];
}

// ===== sensors.js =====

// Ubicaciones reales de sensores (TEC de Monterrey, Clarity, red ciudadana
// PA — ver scripts/fetch_sensors.py). El AQI que se les asigna abajo sigue
// siendo simulado (random walk): reemplaza `startMockFeed` con una
// suscripción real (WebSocket/MQTT/REST) cuando haya lecturas en vivo — el
// contrato (`onUpdate(features)`) es todo lo que main.js depende de esto,
// así que cambiar la fuente no toca código del mapa.

const SENSOR_SITES = REAL_SENSOR_SITES;

function randomWalk(value, min, max, step) {
  const next = value + (Math.random() - 0.5) * step;
  return Math.max(min, Math.min(max, next));
}

function toFeatureCollection(state) {
  return {
    type: "FeatureCollection",
    features: SENSOR_SITES.map((site) => ({
      type: "Feature",
      id: site.id,
      geometry: { type: "Point", coordinates: site.coords },
      properties: {
        id: site.id,
        name: site.name,
        aqi: Math.round(state[site.id]),
        updatedAt: new Date().toISOString(),
      },
    })),
  };
}

// Starts an in-browser simulation and calls `onUpdate` with a GeoJSON
// FeatureCollection every `intervalMs`. Returns a `stop()` function.
function startMockFeed(onUpdate, intervalMs = 4000) {
  const state = Object.fromEntries(
    SENSOR_SITES.map((site) => [site.id, 40 + Math.random() * 80])
  );

  onUpdate(toFeatureCollection(state));

  const timer = setInterval(() => {
    for (const site of SENSOR_SITES) {
      state[site.id] = randomWalk(state[site.id], 5, 280, 25);
    }
    onUpdate(toFeatureCollection(state));
  }, intervalMs);

  return () => clearInterval(timer);
}

    ...f,

// --- Nubes 2D y halo: uno se convierte en el otro ---------------------------

// allá, las nubes se desvanecen y en su lugar "florece" el halo de su mismo
// color (mapa de calor). El halo nunca se ve por encima de este zoom.
// (El zoom actual se muestra en la línea de estado del panel.)
const CLOUD_2D_MIN_ZOOM = 10;
// CLOUD_HALO_SWAP_MS: duración de la animación nube <-> halo.
const CLOUD_HALO_SWAP_MS = 900;
// HALO_OPACITY: opacidad del halo una vez que aparece.
const HALO_OPACITY = 0.35;
// HALO_RADIUS_BY_ZOOM: radio en píxeles de pantalla, pares [zoom, radio].
const HALO_RADIUS_BY_ZOOM = [6, 40, 10, 45];
// HALO_BLUR: 0 = borde duro, 1 = totalmente difuminado.
const HALO_BLUR = 1;
// HALO_MIN_ZOOM: más lejos que esto (país / planeta) el halo tampoco se ve —
// si no, en el globo de la intro los 66 halos se juntan en una mancha.
const HALO_MIN_ZOOM = 6;

let showHalo = true; // el botón "Halo" lo apaga del todo; si está encendido, aparece solo al alejarse

// --- Calidad del aire a escala México (pantalla de inicio) -------------------
// Pronóstico CAMS de Copernicus vía Open-Meteo (gratis, sin llave): AQI de
// EE. UU. en una malla de puntos sobre México (src/mexicoGrid.js, generada por
// scripts/fetch_mexico_grid.py). Resolución ~45 km: sirve para el país, no
// para la ciudad — ahí mandan los sensores. Se ve de lejos (planeta / país) y
// se desvanece al acercarse, antes de que aparezca el halo de los sensores.
const COUNTRY_AQ_URL = "https://air-quality-api.open-meteo.com/v1/air-quality";
// COUNTRY_AQ_OPACITY: opacidad de la mancha de color sobre México.
const COUNTRY_AQ_OPACITY = 0.55;
// COUNTRY_AQ_FADE_ZOOM: [empieza a desvanecerse, ya no se ve].
const COUNTRY_AQ_FADE_ZOOM = [5, 6];
// COUNTRY_AQ_RADIUS: radio de cada punto medido en grados de la malla — 1 =
// toca al vecino; más grande = manchas más fundidas entre sí.
const COUNTRY_AQ_RADIUS = 2.2;
// COUNTRY_AQ_BLUR: 0 = borde duro, 1 = totalmente difuminado.
const COUNTRY_AQ_BLUR = 1;
let countryAirQuality = null; // FeatureCollection con la última respuesta de Open-Meteo

// true tras la primera vez que corre initializeStyle() — algunas cosas
// (listeners, el feed de datos simulados) deben quedar armadas una sola
// vez; el resto (capas, fuentes, terreno) se vuelve a montar en cada
// "style.load".
let oneTimeSetupDone = false;
let lastSensorCollection = null; // para repoblar sensores al instante tras un cambio de estilo

function initializeStyle() {
  map.addSource("mapbox-dem", {
    type: "raster-dem",
    url: "mapbox://mapbox.mapbox-terrain-dem-v1",
    tileSize: 512,
    maxzoom: 14,
  });
  map.setTerrain({ source: "mapbox-dem", exaggeration: TERRAIN_EXAGGERATION });
  map.setFog(HORIZON_FOG);

  // Líneas y estaciones reales del Metrorrey (datos de OpenStreetMap, ver
  // scripts/fetch_metro.py). El color de cada línea sale de la propia data
  // (["get","color"]), así que basta con actualizar metro.js si cambian.
  map.addSource("metro-lines", { type: "geojson", data: METRO_LINES });
  map.addLayer({
    id: "metro-lines-layer",
    type: "line",
    source: "metro-lines",
    layout: { "line-cap": "round", "line-join": "round" },
    paint: {
      "line-color": metroLineExpression("color"),
      "line-width": 4,
      "line-opacity": metroLineExpression("opacity"),
    },
  });

  map.addSource("metro-stations", { type: "geojson", data: METRO_STATIONS_WITH_PRIMARY_LINE });
  map.addLayer({
    id: "metro-stations-layer",
    type: "circle",
    source: "metro-stations",
    paint: {
      "circle-radius": 2,
      // Si la estación es de varias líneas, toma el color de la primera
      // (primaryLine) — no hay forma de pintar un círculo con dos colores.
      "circle-color": metroLineExpression("color", "primaryLine"),
      "circle-stroke-width": 1.2,
      "circle-stroke-color": metroLineExpression("color", "primaryLine"),
    },
  });
  map.addLayer({
    id: "metro-stations-label",
    type: "symbol",
    source: "metro-stations",
    minzoom: 13,
    layout: {
      "text-field": ["get", "name"],
      "text-size": 11,
      "text-offset": [0, 1.1],
      "text-anchor": "top",
      visibility: "none", // escondida por ahora a pedido — quita esta línea para reactivarla
    },
    paint: {
      "text-color": "#ffffff",
      "text-halo-color": "#000000",
      "text-halo-width": 1,
    },
  });

  // Calidad del aire a escala México (ver COUNTRY_AQ_*). Va debajo de todo
  // lo de los sensores; nace vacía y la llena fetchCountryAirQuality().
  map.addSource("country-aq", {
    type: "geojson",
    data: countryAirQuality ?? { type: "FeatureCollection", features: [] },
  });
  // Radio en píxeles de COUNTRY_AQ_RADIUS grados: en zoom 0 el mundo mide
  // 512 px de ancho (360°), y se duplica con cada nivel de zoom.
  const countryRadiusAtZoom0 = (COUNTRY_AQ_RADIUS * 512) / 360;
  map.addLayer({
    id: "country-aq-layer",
    type: "circle",
    source: "country-aq",
    maxzoom: COUNTRY_AQ_FADE_ZOOM[1],
    paint: {
      "circle-color": aqiGradientExpression(),
      "circle-radius": ["interpolate", ["exponential", 2], ["zoom"], 0, countryRadiusAtZoom0, 10, countryRadiusAtZoom0 * 1024],
      "circle-opacity": ["interpolate", ["linear"], ["zoom"], COUNTRY_AQ_FADE_ZOOM[0], COUNTRY_AQ_OPACITY, COUNTRY_AQ_FADE_ZOOM[1], 0],
      "circle-blur": COUNTRY_AQ_BLUR,
      "circle-pitch-alignment": "map",
    },
  });

  map.addSource("sensors", {
    type: "geojson",
    data: { type: "FeatureCollection", features: [] },
  });

  // Halo de color bajo cada sensor, del color de su AQI. Solo aparece al
  // alejar el zoom: los halos vecinos se mezclan y la ciudad se lee como un
  // mapa de calor. Ajustes en HALO_* (arriba de initializeStyle).
  map.addLayer({
    id: "sensor-base",
    type: "circle",
    source: "sensors",
    minzoom: HALO_MIN_ZOOM,
    paint: {
      "circle-color": aqiGradientExpression(),
      "circle-radius": ["interpolate", ["linear"], ["zoom"], ...HALO_RADIUS_BY_ZOOM],
      // La opacidad la cambia updateCloudHaloSwap() según el zoom; el
      // "-transition" hace que aparezca/desaparezca animado, y el delay que
      // florezca justo mientras la nube se va.
      "circle-opacity": map.getZoom() < CLOUD_2D_MIN_ZOOM ? HALO_OPACITY : 0, // nace ya en su estado (sin animar)
      "circle-opacity-transition": { duration: CLOUD_HALO_SWAP_MS, delay: CLOUD_HALO_SWAP_MS / 3 },
      "circle-blur": HALO_BLUR,
      "circle-pitch-alignment": "map", // acostado sobre el suelo, no de frente a la cámara
    },
  });

  map.addLayer(sensorColumnsLayer);

  // Ícono plano (SDF) de la misma nube del SVG, para el modo 2D — el color
  // sale de aqiGradientExpression(), la misma expresión que ya usa el halo
  // de la base, así que la simbología es consistente entre ambos modos.
  map.addImage("cloud-icon-2d", buildCloudIconImage(), { sdf: true });
  map.addLayer({
    id: "sensor-cloud-2d",
    type: "symbol",
    source: "sensors",

      visibility: "none", // el toggle lo activa al entrar a modo 2D
    },
    paint: {
      "icon-color": aqiGradientExpression(),
      // Nace ya en el estado del zoom actual — si naciera visible, al abrir
      // la página (planeta, muy lejos) se veía una nube que se desvanecía.
      // Después la cambia updateCloudHaloSwap() según el zoom.
      "icon-opacity": map.getZoom() < CLOUD_2D_MIN_ZOOM ? 0 : 1,
      "icon-opacity-transition": { duration: CLOUD_HALO_SWAP_MS },
    },
  });

  buildLegend();
  buildMetroLegend();

  // El feed de datos y los listeners de eventos (popups, botones) solo se
  // arman una vez — re-armarlos en cada cambio de estilo duplicaría
  // popups/intervalos, no los reemplazaría.
  if (!oneTimeSetupDone) {
    oneTimeSetupDone = true;
    setupMagnifier();
    setupCloudLabel();
    wirePopups();
    wireMetroPopups();
    wireViewToggle();
    wireVariantToggles();
    wireCloudToggle();
    wireHaloToggle();
    wireMetroToggle();
    wireColumnToggle();
    wireShapeToggle();

    fetchCountryAirQuality();
    startMockFeed((collection) => {
      lastSensorCollection = collection;
      applySensorUpdate(collection);
    });
  } else if (lastSensorCollection) {
    // La fuente "sensors" es nueva (el estilo se acaba de recargar) — hay
    // que repoblarla ya, no esperar al próximo tick del feed.
    applySensorUpdate(lastSensorCollection);
  }

  // Re-aplica el modo 2D/3D actual sobre las capas recién montadas — sin
  // esto, cambiar de estilo siempre "resetearía" a la vista 3D por defecto.
  setViewMode(is3DMode);
  setMetroVisible(showMetro);
  updateCloudHaloSwap(true); // capas recién montadas: aplica el estado del zoom actual
}

// Pide a Open-Meteo el AQI actual de toda la malla de México en una sola
// consulta. Si falla (sin internet, límite de uso), el mapa sigue igual, sin
// la capa del país.
async function fetchCountryAirQuality() {
  const params = new URLSearchParams({
    latitude: MEXICO_GRID.map(([, lat]) => lat).join(","),
    longitude: MEXICO_GRID.map(([lon]) => lon).join(","),
    current: "us_aqi",
  });
  try {
    const response = await fetch(`${COUNTRY_AQ_URL}?${params}`);
    if (!response.ok) throw new Error(`HTTP ${response.status}`);
    const json = await response.json();
    const results = Array.isArray(json) ? json : [json]; // un solo punto no viene en lista
    countryAirQuality = {
      type: "FeatureCollection",
      features: results
        .map((result, i) => ({
          type: "Feature",
          geometry: { type: "Point", coordinates: MEXICO_GRID[i] },
          properties: { aqi: result.current?.us_aqi },
        }))
        .filter((f) => f.properties.aqi != null),
    };
    map.getSource("country-aq")?.setData(countryAirQuality);
  } catch (error) {
    console.warn("No se pudo cargar la calidad del aire de México (Open-Meteo):", error);
  }
}

function applySensorUpdate(collection) {
  map.getSource("sensors").setData(collection);
  updateColumnMeshes(collection);
  updateSpaceColor(collection);
  lastUpdateTime = new Date().toLocaleTimeString();
  updateStatus();
}

map.on("style.load", initializeStyle);

// Línea de estado del panel: hora de la última lectura + zoom actual (para
// poder elegir a ojo valores como CLOUD_2D_MIN_ZOOM o los del halo).
let lastUpdateTime = null;

function updateStatus() {

  document.getElementById("status").textContent = `En vivo (datos simulados)${time} · zoom ${map.getZoom().toFixed(1)}`;
}

// Nube 2D <-> halo según el zoom (ver CLOUD_2D_MIN_ZOOM). Solo actúa al
// cruzar el umbral; la transición de Mapbox anima el cambio.
let haloZoneActive = null; // true = lejos (halo), false = cerca (nubes); null = sin aplicar aún

function updateCloudHaloSwap(force = false) {
  const far = map.getZoom() < CLOUD_2D_MIN_ZOOM;
  if (far === haloZoneActive && !force) return;
  haloZoneActive = far;
  if (map.getLayer("sensor-cloud-2d")) map.setPaintProperty("sensor-cloud-2d", "icon-opacity", far ? 0 : 1);
  if (map.getLayer("sensor-base")) map.setPaintProperty("sensor-base", "circle-opacity", far ? HALO_OPACITY : 0);
}
map.on("zoom", () => updateCloudHaloSwap());

// --- Color del espacio según el sensor más cercano -------------------------
// Mientras no haya ubicación (pantalla de inicio), el espacio queda neutro.
let userLngLat = null; // la pone "Mi ubicación" (simulada, ver SIMULATED_LOCATION)

// Distancia en km sobre la esfera terrestre (haversine).
function distanceKm(a, b) {
  const toRad = Math.PI / 180;
  const dLat = (b.lat - a.lat) * toRad;
  const dLng = (b.lng - a.lng) * toRad;
  const h = Math.sin(dLat / 2) ** 2 + Math.cos(a.lat * toRad) * Math.cos(b.lat * toRad) * Math.sin(dLng / 2) ** 2;
  return 12742 * Math.asin(Math.sqrt(h));
}

function updateSpaceColor(collection) {
  if (!userLngLat) return;
  const reference = userLngLat;
  let nearest = null;
  let nearestKm = Infinity;
  for (const feature of collection.features) {
    const [lng, lat] = feature.geometry.coordinates;
    const km = distanceKm(reference, { lng, lat });
    if (km < nearestKm) {
      nearestKm = km;
      nearest = feature;
    }
  }
  if (!nearest) return;
  const [r, g, b] = gradientRgbAt(fractionForAqi(nearest.properties.aqi)).map(
    (c) => Math.round(255 * (1 - SPACE_COLOR_STRENGTH + c * SPACE_COLOR_STRENGTH))
  );
  // space-color de Mapbox no pintaba bien el tono en Standard (salía gris),
  // así que el espacio se deja transparente y se colorea el fondo del mapa.
  map.getContainer().style.background = `rgb(${r}, ${g}, ${b})`;
}

// --- Dimensiones de la columna -------------------------------------------
// COLUMN_RADIUS_METERS: radio del cilindro y de la media esfera de la
// punta (su altura es igual a este radio — así el remate es un semicírculo
// real, nunca un óvalo).
const COLUMN_RADIUS_METERS = 50;
// COLUMN_RADIAL_SEGMENTS: lados alrededor del cilindro/domo (más = más
// liso; pocos se ve facetado/"estriado").
const COLUMN_RADIAL_SEGMENTS = 32;
// COLUMN_CAP_SEGMENTS: anillos que forman la curva de la media esfera
// (más = domo más suave).
const COLUMN_CAP_SEGMENTS = 12;
// --- Versión "pila de nubes" (botón "Columnas de nubes") ------------------
// La nube del SVG en plano, acostada, repetida hacia arriba; cada capa toma
// el color del degradado según su altura.
// STACK_CLOUD_WIDTH_METERS: ancho de cada nube de la pila.
const STACK_CLOUD_WIDTH_METERS = 110;
// STACK_SPACING_METERS: separación vertical entre una nube y la siguiente.
const STACK_SPACING_METERS = 45;
// STACK_CLOUD_THICKNESS_METERS: grosor de cada nube de la pila.
const STACK_CLOUD_THICKNESS_METERS = 5;
// STACK_HEIGHT_MULTIPLIER: cuántas veces más alta que la cápsula.
const STACK_HEIGHT_MULTIPLIER = 2.5;
// COLUMN_FLOAT_GAP_METERS: separación fija sobre el terreno — la columna
// flota, nunca toca el suelo (así el relieve real nunca la "corta").
const COLUMN_FLOAT_GAP_METERS = 40;
// --- Tamaño en pantalla al alejar la cámara (ver zoomBoost en render()) ---
// ZOOM_BOOST_REFERENCE: nivel de zoom en el que columnas/nube se ven a su
// tamaño "perfecto" (sin agrandar) — coincide con el zoom inicial del mapa.
const ZOOM_BOOST_REFERENCE = 12.2;
// ZOOM_BOOST_MAX: tope del agrandado al alejarse mucho (ej. ver la ciudad
// completa), para que sigan siendo visibles sin volverse gigantescas.
const ZOOM_BOOST_MAX = 6;
// ---------------------------------------------------------------------------

// Construye una cápsula real (cilindro + media esfera) para un sensor, con
// un color por vértice que sigue COLUMN_GRADIENT a lo largo de la altura.
// A diferencia de apilar prismas (fill-extrusion), esto es una sola
// superficie continua: no hay costuras ni z-fighting posible.
let columnShape = "stack"; // "round" (cápsula) | "stack" (pila de nubes) — al pasar a 3D se ve la pila

// La cápsula es geometría normal; la pila de nubes vive en su propio
// InstancedMesh (ver updateCloudStack), así que en ese modo la cápsula queda vacía.
function buildColumnGeometry(aqi) {
  if (columnShape === "stack") return new THREE.BufferGeometry();
  return buildCapsuleGeometry(aqi);
}

// Altura real de la columna según la forma actual (la pila es más alta).
function columnHeightFor(aqi) {
  return heightForAqi(aqi) * (columnShape === "stack" ? STACK_HEIGHT_MULTIPLIER : 1);
}

function buildCapsuleGeometry(aqi) {
  const totalHeight = heightForAqi(aqi);
  // Si la columna es más baja que el diámetro, el radio se encoge con ella
  // (no puede ser una media esfera más alta que la columna misma).
  const radius = Math.min(COLUMN_RADIUS_METERS, Math.max(totalHeight / 2, 1));
  const straightLength = Math.max(totalHeight - 2 * radius, 0);

  // La columna flota (ver COLUMN_FLOAT_GAP_METERS en render()), así que
  // los dos extremos redondeados de CapsuleGeometry quedan bien — nunca
  // tocan terreno real, no hay taper que "se corte" contra el relieve.
  const geometry = new THREE.CapsuleGeometry(radius, straightLength, COLUMN_CAP_SEGMENTS, COLUMN_RADIAL_SEGMENTS);
  geometry.translate(0, straightLength / 2 + radius, 0); // la punta inferior queda en y=0
  geometry.rotateX(Math.PI / 2); // "arriba" pasa de Y (Three.js) a Z (altitud en Mercator)
  return applyHeightGradient(geometry, aqi, totalHeight);
}

// Pila de nubes con INSTANCING: una sola nube delgada (contorno del SVG
// simplificado a STACK_CLOUD_OUTLINE_POINTS, extruido
// STACK_CLOUD_THICKNESS_METERS) que todas las columnas comparten. Cada pila es
// un InstancedMesh que la repite en cada capa con su propio color — una sola
// llamada de dibujo por sensor, y ante una lectura nueva solo se mueven
// capas y colores (no se reconstruye geometría).
const STACK_CLOUD_OUTLINE_POINTS = 32;
let stackCloudTemplate = null;

function getStackCloudTemplate() {
  if (stackCloudTemplate) return stackCloudTemplate;
  const cx = CLOUD_SVG_VIEWBOX.width / 2;
  const cy = CLOUD_SVG_VIEWBOX.height / 2;
  const shape = new THREE.Shape(
    sampleSvgPathPoints(CLOUD_SVG_PATH_D, STACK_CLOUD_OUTLINE_POINTS).map(([x, y]) => new THREE.Vector2(x - cx, -(y - cy)))
  );
  const geometry = new THREE.ExtrudeGeometry(shape, { depth: 1, bevelEnabled: false, curveSegments: 1 });
  const scale = STACK_CLOUD_WIDTH_METERS / CLOUD_SVG_VIEWBOX.width;
  // XY = plano horizontal de Mercator; la extrusión (Z) queda como el grosor.
  geometry.scale(scale, scale, STACK_CLOUD_THICKNESS_METERS);
  stackCloudTemplate = geometry;
  return geometry;
}

// Máximo de capas que puede necesitar una pila (AQI más alto).
const STACK_MAX_LAYERS = Math.ceil((heightForAqi(500) * STACK_HEIGHT_MULTIPLIER) / STACK_SPACING_METERS) + 1;

// Acomoda las capas de una pila para su AQI: cuántas se dibujan, a qué
// altura y de qué color (el del degradado a esa altura).
const stackLayerMatrix = new THREE.Matrix4();
const stackLayerColor = new THREE.Color();

function updateCloudStack(stack, aqi) {
  const totalHeight = Math.max(heightForAqi(aqi) * STACK_HEIGHT_MULTIPLIER, 1);
  const topFraction = fractionForAqi(aqi);
  const layers = Math.min(STACK_MAX_LAYERS, Math.floor(totalHeight / STACK_SPACING_METERS) + 1);
  for (let k = 0; k < layers; k++) {
    const z = Math.min(k * STACK_SPACING_METERS, totalHeight);
    stack.setMatrixAt(k, stackLayerMatrix.makeTranslation(0, 0, z));
    const [r, g, b] = gradientRgbAt((z / totalHeight) * topFraction);
    stack.setColorAt(k, stackLayerColor.setRGB(r, g, b));
  }
  stack.count = layers;
  stack.instanceMatrix.needsUpdate = true;
  if (stack.instanceColor) stack.instanceColor.needsUpdate = true;
}

// Color por vértice que sigue COLUMN_GRADIENT a lo largo de la altura.
function applyHeightGradient(geometry, aqi, totalHeight) {
  const topFraction = fractionForAqi(aqi);
  const position = geometry.attributes.position;
  const colors = new Float32Array(position.count * 3);
  for (let i = 0; i < position.count; i++) {
    const heightFrac = Math.min(1, Math.max(0, position.getZ(i) / totalHeight));
    const [r, g, b] = gradientRgbAt(heightFrac * topFraction);
    colors[i * 3] = r;
    colors[i * 3 + 1] = g;
    colors[i * 3 + 2] = b;
  }
  geometry.setAttribute("color", new THREE.BufferAttribute(colors, 3));

  return geometry;
}

// --- Nube encima de cada columna --------------------------------------
// Contorno pegado de FIGURAS/nube.svg (su atributo "d"). Si cambias el
// SVG, reemplaza este string y el viewBox de abajo.
const CLOUD_SVG_PATH_D =
  "M287.57,110.4s-.21-1.97-.43-3.37c-.5-3.18-1.96-10.74-8.23-22.25-2.93-5.37-8.26-14.97-18.48-24.97-2.62-2.56-9.22-8.72-19.19-14.63-5.16-3.06-15.65-8.66-30.13-11.91-5.1-1.15-14.75-2.91-26.98-2.45-3.7.14-13.62.7-25.93,4.2-11.42,3.25-19.59,7.54-22.77,9.28-4.93,2.71-12.49,6.94-20.32,14.72-.73.72-3.75,3.75-7.3,8.31-5.5,7.05-9.03,13.63-11.25,18.4l-4.23,8.76c-6.38,1.15-25.13,4.16-42.04,23.12-3.68,4.13-18.01,18.56-19.97,43.8-.33,4.29-2.44,21.97,5.61,40.12,2.27,5.12,9.92,20.44,26.8,32.58,17.1,12.3,35.09,15,47.65,15.24,78.91,1.53,129.12.61,177.81-.53,10.82-.25,22.46-4.26,35.74-16.64,13.59-12.66,19.85-28.47,21.37-34.34,1.53-5.89,3.46-17.81.53-33.02-1.31-6.77-4.65-22.51-17.34-34.16-5.12-4.7-11.17-8.18-14.01-9.81-7.19-4.13-13.37-6.43-16.64-7.53-3.98-1.35-10.16-2.8-10.16-2.8l-.1-.14Z";
const CLOUD_SVG_VIEWBOX = { width: 370.04, height: 275.31 };

// Rasteriza la nube en blanco sobre fondo transparente — el formato que
// Mapbox espera para un ícono SDF (map.addImage con sdf:true), que luego
// se puede teñir dinámicamente por feature vía la propiedad "icon-color".
function buildCloudIconImage(size = 128) {
  const w = size;
  const h = Math.round(size * (CLOUD_SVG_VIEWBOX.height / CLOUD_SVG_VIEWBOX.width));
  const canvas = document.createElement("canvas");
  canvas.width = w;
  canvas.height = h;
  const ctx = canvas.getContext("2d");
  ctx.scale(w / CLOUD_SVG_VIEWBOX.width, h / CLOUD_SVG_VIEWBOX.height);
  ctx.fillStyle = "#fff";
  ctx.fill(new Path2D(CLOUD_SVG_PATH_D));
  return ctx.getImageData(0, 0, w, h);
}

// COLUMN_RADIUS_METERS y sus vecinas controlan la columna; estas de aquí
// abajo controlan solo la nube — edítalas para ajustar tamaño/volumen/gap.
const CLOUD_WIDTH_METERS = 300; // ancho real de la nube (eje X del SVG)
const CLOUD_DEPTH_SVG_UNITS = 45; // "grosor" de la extrusión, en unidades del SVG antes de escalar a metros
const CLOUD_BEVEL_SVG_UNITS = 14; // redondeo de los bordes — más = más orgánica/inflada
const CLOUD_BEVEL_SEGMENTS = 8; // suavidad de ese redondeo
const CLOUD_GAP_METERS = 190; // separación entre la punta de la columna y la base de la nube
// Alto real de la nube en metros (eje vertical del SVG, ya escalado) — se
// usa para compensar la posición cuando crece por hover (ver CLOUD_HOVER_SCALE).
const CLOUD_HEIGHT_METERS = CLOUD_SVG_VIEWBOX.height * (CLOUD_WIDTH_METERS / CLOUD_SVG_VIEWBOX.width);

// Samplea un <path> SVG en una polilínea usando la propia API del navegador
// (getPointAtLength) — evita tener que escribir un parser de curvas Bézier
// a mano para interpretar el atributo "d".
function sampleSvgPathPoints(d, sampleCount) {
  const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
  path.setAttribute("d", d);
  const length = path.getTotalLength();
  const points = [];
  for (let i = 0; i < sampleCount; i++) {
    const { x, y } = path.getPointAtLength((i / sampleCount) * length);
    points.push([x, y]);
  }
  return points;
}

// Construye la geometría de la nube UNA sola vez (misma forma para los 8
// sensores; solo el color y la posición cambian por sensor). Extruye el
// contorno del SVG con bisel para que se vea inflada, no un recorte plano.
// Como la nube siempre gira para encarar la cámara (ver "facing" en
// render()), no necesita curvarse también en el frente/reverso — de frente
// un bisel ya se ve redondeado.
function buildCloudGeometry() {
  const points = sampleSvgPathPoints(CLOUD_SVG_PATH_D, 160);
  const cx = CLOUD_SVG_VIEWBOX.width / 2;
  const cy = CLOUD_SVG_VIEWBOX.height / 2;

  const shape = new THREE.Shape();
  points.forEach(([x, y], i) => {
    const px = x - cx;
    const py = -(y - cy); // el SVG crece hacia abajo; volteamos para que "arriba" quede arriba
    if (i === 0) shape.moveTo(px, py);
    else shape.lineTo(px, py);
  });
  shape.closePath();

  const geometry = new THREE.ExtrudeGeometry(shape, {
    depth: CLOUD_DEPTH_SVG_UNITS,
    bevelEnabled: true,
    bevelThickness: CLOUD_BEVEL_SVG_UNITS,
    bevelSize: CLOUD_BEVEL_SVG_UNITS,
    bevelSegments: CLOUD_BEVEL_SEGMENTS,
  });
  geometry.center();
  geometry.rotateX(Math.PI / 2); // igual que la columna: "arriba" pasa de Y a Z

  // Las unidades del SVG (~370 de ancho) no son metros — reescala todo el
  // bloque (ancho, profundidad y bisel ya incluidos) a CLOUD_WIDTH_METERS.
  const scaleToMeters = CLOUD_WIDTH_METERS / CLOUD_SVG_VIEWBOX.width;
  geometry.scale(scaleToMeters, scaleToMeters, scaleToMeters);

  return geometry;
}
// -----------------------------------------------------------------------

// Capa Mapbox GL "custom": dibuja mallas de Three.js (una cápsula + una
// nube por sensor) sobre el mismo contexto WebGL que usa el mapa. La
// posición de cada sensor es fija (SENSOR_SITES), así que su matriz de
// mundo se recalcula cada frame; la geometría de la columna y el color de
// la nube solo se actualizan cuando cambia el AQI (ver updateColumnMeshes).
const columnMeshes = {}; // site.id -> { mesh, lngLat }
const cloudMeshes = {}; // site.id -> { mesh, lngLat }
const columnHeights = {}; // site.id -> altura actual de la columna (metros)
let columnsRenderer, columnsScene, columnsCamera;
let render3DColumns = false; // el mapa abre en 2D; setViewMode(true) lo enciende sin desmontar la capa
let showClouds = false; // nubes 3D sobre las columnas: apagadas al inicio, se encienden con el botón "Nubes"
let showColumns = true; // el botón "Ocultar columnas" las esconde, sea cual sea su forma

// site.id -> multiplicador de tamaño de su nube mientras el mouse está
// encima (ver wirePopups) — 1 (o ausente) es el tamaño normal.
const cloudHoverScale = {};
const CLOUD_HOVER_SCALE = 5;
// CLOUD_ROTATION_DEG: giro extra de las nubes 3D que flotan sobre las
// columnas, alrededor de su eje vertical. (Las pilas de nubes no lo usan:
// giran solas hacia la cámara, ver render().)
const CLOUD_ROTATION_DEG = 180;

function mercatorDistance(a, b) {
  const dx = a.x - b.x;
  const dy = a.y - b.y;
  const dz = (a.z ?? 0) - (b.z ?? 0);
  return Math.sqrt(dx * dx + dy * dy + dz * dz);
}

const sensorColumnsLayer = {
  id: "sensor-columns-3d-layer",
  type: "custom",
  renderingMode: "3d",

  onAdd(mapInstance, gl) {
    columnsCamera = new THREE.Camera();
    columnsScene = new THREE.Scene();
    columnsScene.add(new THREE.AmbientLight(0xffffff, 0.9));
    const sunLight = new THREE.DirectionalLight(0xffffff, 0.35);
    sunLight.position.set(0, -70, 100);
    columnsScene.add(sunLight);

    // Si la nube falla al construirse, que se quede sin nube — nunca debe
    // tumbar las columnas (antes vivían en el mismo bloque sin protección,
    // así que un error acá dejaba a onAdd() a medias: sin columnMeshes, sin
    // columnsRenderer, y por tanto sin nada dibujándose en ningún frame).
    let sharedCloudGeometry = null;
    try {
      sharedCloudGeometry = buildCloudGeometry();
    } catch (err) {
      console.error("No se pudo construir la nube 3D; se omite.", err);
    }

    for (const site of SENSOR_SITES) {
      const lngLat = { lng: site.coords[0], lat: site.coords[1] };

      const columnMesh = new THREE.Mesh(
        new THREE.BufferGeometry(),
        // DoubleSide: las nubes planas de la pila se ven también desde abajo.
        new THREE.MeshBasicMaterial({ vertexColors: true, transparent: true, opacity: 0.85, side: THREE.DoubleSide })
      );
      columnMesh.matrixAutoUpdate = false;
      columnsScene.add(columnMesh);

      const stackMesh = new THREE.InstancedMesh(
        getStackCloudTemplate(),
        new THREE.MeshBasicMaterial({ transparent: true, opacity: 0.85, side: THREE.DoubleSide }),
        STACK_MAX_LAYERS
      );
      stackMesh.count = 0; // se llena en updateColumnMeshes()
      stackMesh.matrixAutoUpdate = false;
      stackMesh.frustumCulled = false; // sus capas suben muy por encima de su esfera de recorte
      columnsScene.add(stackMesh);

      columnMeshes[site.id] = { mesh: columnMesh, stack: stackMesh, lngLat };

      if (sharedCloudGeometry) {
        const cloudMesh = new THREE.Mesh(
          sharedCloudGeometry,
          new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.55 })
        );
        cloudMesh.matrixAutoUpdate = false;
        cloudMesh.visible = showClouds;
        columnsScene.add(cloudMesh);
        cloudMeshes[site.id] = { mesh: cloudMesh, lngLat };
      }
    }

    columnsRenderer = new THREE.WebGLRenderer({
      canvas: mapInstance.getCanvas(),
      context: gl,
      antialias: true,
    });
    columnsRenderer.autoClear = false;

    // Compila de una vez los shaders de columnas, pilas y nubes. Si no, se
    // compilan la primera vez que se dibujan — justo al pasar a 3D por
    // primera vez, y eso trababa la animación.
    columnsRenderer.compile(columnsScene, columnsCamera);
  },

  render(gl, matrix) {
    if (!render3DColumns) return; // modo 2D: no dibujar columnas ni nubes 3D

    columnsCamera.projectionMatrix = new THREE.Matrix4().fromArray(matrix);

    // A escala real, alejar la cámara para ver toda la ciudad encoge las
    // columnas a casi nada (son ~65m de radio contra ~40km de ciudad) — eso
    // es "correcto" pero las pierde de vista. zoomBoost las agranda al
    // alejarse más allá de ZOOM_BOOST_REFERENCE, sin tocarlas cuando el
    // zoom ya es igual o mayor (el nivel donde se ven "perfectas").
    const zoom = map.getZoom();
    const zoomBoost =
      zoom >= ZOOM_BOOST_REFERENCE ? 1 : Math.min(ZOOM_BOOST_MAX, 2 ** (ZOOM_BOOST_REFERENCE - zoom));

    const cameraPosition = map.getFreeCameraOptions().position;
    for (const { mesh, stack, lngLat } of Object.values(columnMeshes)) {
      // El terreno (DEM) carga después del primer frame y eleva el suelo
      // por encima de 0 — hay que anclar cada columna a la elevación real
      // del terreno en cada frame, o quedan enterradas bajo él.
      const elevation = map.queryTerrainElevation(lngLat) ?? 0;
      const mercator = mapboxgl.MercatorCoordinate.fromLngLat(lngLat, elevation + COLUMN_FLOAT_GAP_METERS);
      const scale = mercator.meterInMercatorCoordinateUnits() * zoomBoost;
      // Igual que las nubes flotantes: cada columna gira sobre su eje hacia
      // la cámara, así al rotar el mapa pirámides y pilas de nubes se ven
      // siempre del mismo lado (a la cápsula, que es redonda, no le afecta).
      const facingCamera = Math.atan2(cameraPosition.x - mercator.x, -(cameraPosition.y - mercator.y));
      mesh.matrix
        .makeTranslation(mercator.x, mercator.y, mercator.z)
        .scale(new THREE.Vector3(scale, scale, scale))
        .multiply(new THREE.Matrix4().makeRotationZ(facingCamera));
      stack.matrix.copy(mesh.matrix);
    }

    // Igual que en onAdd(): un error posicionando las nubes no debe impedir
    // que columnsRenderer.render() se llegue a ejecutar — si eso se salta,
    // NADA se dibuja ese frame (ni columnas ni nubes).
    try {
      // La nube solo se ve "de nube" (con sus lóbulos) de frente — de canto
      // siempre es un lente, sin importar qué tan gorda la hagamos (es
      // geometría 2D inflada, no un modelo 3D real). Así que la giramos
      // sobre su eje vertical para que su cara siempre apunte hacia la
      // posición REAL de la cámara 3D de Mapbox (no una aproximación por
      // bearing, que no pudimos verificar a ojo la primera vez).
      const canvas = map.getCanvas();

      // Hit-test manual: Mapbox no puede detectar hover sobre una capa
      // "custom" (las nubes son WebGL de Three.js), así que en vez de
      // escuchar el halo en el suelo, cada frame proyectamos la posición
      // de reposo (sin hover, para que la zona de detección no cambie
      // mientras la nube crece) de cada nube a pantalla y nos quedamos con
      // la más cercana al cursor que lo contenga.
      let hitId = null;
      let hitDist = Infinity;
      if (mouseCanvasX != null && !showClouds && showColumns) {
        // Sin nubes, el hover se detecta sobre la columna: el segmento de
        // pantalla entre su base y su punta, con un margen de su radio.
        for (const [id, { lngLat }] of Object.entries(columnMeshes)) {
          const elevation = map.queryTerrainElevation(lngLat) ?? 0;
          const bottomAlt = elevation + COLUMN_FLOAT_GAP_METERS;
          const topAlt = bottomAlt + (columnHeights[id] ?? 0) * zoomBoost;
          const bottomMercator = mapboxgl.MercatorCoordinate.fromLngLat(lngLat, bottomAlt);
          const bottom = projectMercatorToScreen(matrix, bottomMercator, canvas);
          const top = projectMercatorToScreen(matrix, mapboxgl.MercatorCoordinate.fromLngLat(lngLat, topAlt), canvas);
          const radiusMercator = bottomMercator.meterInMercatorCoordinateUnits() * zoomBoost * COLUMN_RADIUS_METERS;
          const side = projectMercatorToScreen(matrix, { ...bottomMercator, x: bottomMercator.x + radiusMercator }, canvas);
          const radius = Math.max(8, Math.hypot(side.x - bottom.x, side.y - bottom.y)); // mínimo 8px para poder atinarle
          const dist = distanceToSegment(mouseCanvasX, mouseCanvasY, bottom, top);
          if (dist <= radius && dist < hitDist) {
            hitDist = dist;
            hitId = id;
          }
        }
      }
      if (mouseCanvasX != null && showClouds) {
        for (const [id, { lngLat }] of Object.entries(cloudMeshes)) {
          const hitElevation = map.queryTerrainElevation(lngLat) ?? 0;
          const hitColumnTop = columnHeights[id] ?? 0;
          const hitAltitude = hitElevation + (hitColumnTop + CLOUD_GAP_METERS) * zoomBoost;
          const hitMercator = mapboxgl.MercatorCoordinate.fromLngLat(lngLat, hitAltitude);
          const hitScale = hitMercator.meterInMercatorCoordinateUnits() * zoomBoost;
          const center = projectMercatorToScreen(matrix, hitMercator, canvas);
          const edge = projectMercatorToScreen(
            matrix,
            { x: hitMercator.x + hitScale * (CLOUD_WIDTH_METERS / 2), y: hitMercator.y, z: hitMercator.z },
            canvas
          );
          const radius = Math.hypot(edge.x - center.x, edge.y - center.y);
          const dist = Math.hypot(mouseCanvasX - center.x, mouseCanvasY - center.y);
          if (dist <= radius && dist < hitDist) {
            hitDist = dist;
            hitId = id;
          }
        }
      }

      if (hitId !== hoveredSensorId) {
        if (hoveredSensorId) delete cloudHoverScale[hoveredSensorId];
        hoveredSensorId = hitId;
        canvas.style.cursor = hitId ? "pointer" : "";
        if (hitId) {
          cloudHoverScale[hitId] = CLOUD_HOVER_SCALE;
          showSensorPopup(hitId);
        } else {
          hideSensorPopup();
          hideCloudLabel();
        }
      }

      const camPos = map.getFreeCameraOptions().position;
      // Distancia de referencia: de la cámara al centro del mapa. Sirve
      // para normalizar el crecimiento por hover — sin esto, una nube
      // lejana (más chica en pantalla por perspectiva normal) crece menos
      // en píxeles que una cercana, aunque el multiplicador sea el mismo.
      const centerMercator = mapboxgl.MercatorCoordinate.fromLngLat(map.getCenter(), 0);
      const referenceDistance = mercatorDistance(camPos, centerMercator);

      for (const [id, { mesh, lngLat }] of Object.entries(cloudMeshes)) {
        const elevation = map.queryTerrainElevation(lngLat) ?? 0;
        const columnTop = columnHeights[id] ?? 0;
        const baseAltitude = elevation + (columnTop + CLOUD_GAP_METERS) * zoomBoost;

        // Qué tan lejos está ESTA nube de la cámara, respecto a la
        // distancia de referencia — más lejos que el centro = >1 (crece
        // más para compensar), más cerca = <1 (crece menos).
        const baseMercator = mapboxgl.MercatorCoordinate.fromLngLat(lngLat, baseAltitude);
        const distanceFactor = mercatorDistance(camPos, baseMercator) / referenceDistance;

        // El "extra" de tamaño al hacer hover (CLOUD_HOVER_SCALE - 1) se
        // multiplica por zoomBoost y por distanceFactor — si no, al alejar
        // el zoom (todo ya agrandado) o al estar lejos de cámara, un 5x
        // fijo apenas se nota en pantalla.
        const hoverScale = cloudHoverScale[id] ? 1 + (CLOUD_HOVER_SCALE - 1) * zoomBoost * distanceFactor : 1;
        // La nube crece desde su propio centro (queda armada así desde
        // buildCloudGeometry), así que agrandarla también hunde su borde
        // inferior hacia la columna — subimos el centro la mitad de ese
        // crecimiento extra para que el borde inferior quede exactamente
        // donde estaría sin hover (misma separación visual con la columna).
        const hoverLift = (CLOUD_HEIGHT_METERS * zoomBoost * (hoverScale - 1)) / 2;
        const mercator = mapboxgl.MercatorCoordinate.fromLngLat(lngLat, baseAltitude + hoverLift);
        const scale = mercator.meterInMercatorCoordinateUnits() * zoomBoost * hoverScale;

        // Dirección horizontal (en el plano XY de Mercator) de la nube
        // hacia la cámara. buildCloudGeometry() deja el frente de la nube
        // mirando hacia -Y local, así que el ángulo que lo alinea con esa
        // dirección es atan2(dx, -dy).
        const dx = camPos.x - mercator.x;
        const dy = camPos.y - mercator.y;
        const theta = Math.atan2(dx, -dy);
        const facing = new THREE.Matrix4().makeRotationZ(theta + (CLOUD_ROTATION_DEG * Math.PI) / 180);

        mesh.matrix
          .makeTranslation(mercator.x, mercator.y, mercator.z)
          .scale(new THREE.Vector3(scale, scale, scale))
          .multiply(facing);

        if (id === hoveredSensorId && showClouds) {
          const aqi = lastSensorCollection?.features.find((f) => f.properties.id === id)?.properties.aqi;
          if (aqi != null) {
            // El texto debe girar igual que la nube se ve en pantalla (gira
            // para encarar la cámara + la perspectiva del pitch la inclina).
            // Se calcula proyectando dos puntos a los lados de la nube (a lo
            // largo de su eje horizontal real) y midiendo el ángulo entre
            // ellos YA en coordenadas de pantalla — no basta con rotar en 3D,
            // porque la perspectiva también distorsiona el ángulo aparente.
            const halfWidth = scale * (CLOUD_WIDTH_METERS / 2);
            const left = projectMercatorToScreen(
              matrix,
              { x: mercator.x - halfWidth * Math.cos(theta), y: mercator.y - halfWidth * Math.sin(theta), z: mercator.z },
              canvas
            );
            const right = projectMercatorToScreen(
              matrix,
              { x: mercator.x + halfWidth * Math.cos(theta), y: mercator.y + halfWidth * Math.sin(theta), z: mercator.z },
              canvas
            );
            let angleDeg = (Math.atan2(right.y - left.y, right.x - left.x) * 180) / Math.PI;
            // "left"/"right" pueden salir invertidos según hacia dónde mire
            // la cámara — sin esto el texto a veces queda boca abajo.
            if (angleDeg > 90) angleDeg -= 180;
            if (angleDeg < -90) angleDeg += 180;
            // Ancho real que ocupa la nube EN PANTALLA ahora mismo (ya
            // incluye zoomBoost, hoverScale y la distancia a cámara) — el
            // tamaño de letra se deriva de esto para que crezca exactamente
            // a la par de la nube, sea cual sea la causa del crecimiento.
            const screenWidth = Math.hypot(right.x - left.x, right.y - left.y);
            updateCloudLabel(matrix, mercator, aqi, angleDeg, screenWidth);
          }
        }
      }
    } catch (err) {
      console.error("Error posicionando las nubes 3D.", err);
    }

    columnsRenderer.state.reset();
    columnsRenderer.render(columnsScene, columnsCamera);
    // Sin map.triggerRepaint() aquí: eso redibujaba el mapa completo en cada
    // cuadro aunque nada se moviera (medido: la mitad de los fps en 3D).
    // Mapbox ya redibuja al mover la cámara o cargar mosaicos; las lecturas
    // nuevas y el mouse (hover) piden su propio cuadro.
  },

  // Mapbox llama esto cuando la capa se quita del mapa — incluido al
  // cambiar de estilo (setMapStyle borra todas las capas del estilo
  // anterior). Sin esto, cada cambio de estilo dejaría un WebGLRenderer
  // huérfano sin liberar.
  onRemove() {
    columnsRenderer?.dispose();
  },
};

// Distancia (px) del punto (px, py) al segmento a–b en pantalla.
function distanceToSegment(px, py, a, b) {
  const dx = b.x - a.x;
  const dy = b.y - a.y;
  const lengthSq = dx * dx + dy * dy;
  const t = lengthSq ? Math.max(0, Math.min(1, ((px - a.x) * dx + (py - a.y) * dy) / lengthSq)) : 0;
  return Math.hypot(px - (a.x + t * dx), py - (a.y + t * dy));
}

// Reconstruye la geometría de cada columna y el color de su nube con el
// AQI más reciente.
function updateColumnMeshes(collection) {
  for (const feature of collection.features) {
    const { id, aqi } = feature.properties;

    const columnEntry = columnMeshes[id];
    if (columnEntry) {
      columnEntry.mesh.geometry.dispose();
      columnEntry.mesh.geometry = buildColumnGeometry(aqi);
      if (columnShape === "stack") updateCloudStack(columnEntry.stack, aqi);
      else columnEntry.stack.count = 0;
    }

    columnHeights[id] = columnHeightFor(aqi); // la nube y el hover se ubican con esta altura

    const cloudEntry = cloudMeshes[id];
    if (cloudEntry) {
      cloudEntry.mesh.material.color.set(gradientColorAt(fractionForAqi(aqi)));
    }
  }
  map.triggerRepaint();
}

// El hover de sensores se detecta a mano en sensorColumnsLayer.render()
// (hit-test proyectando cada nube a pantalla), no con los eventos nativos
// de Mapbox — las capas "custom" (nuestras nubes/columnas de Three.js) son
// WebGL opaco para Mapbox, no soportan hover nativo. wirePopups() de abajo
// solo arma el popup en sí y el rastreo de la posición del mouse.
let hoveredSensorId = null; // id del sensor bajo el cursor ahora mismo (o null)
let mouseCanvasX = null;
let mouseCanvasY = null;
let sensorPopup;

function wirePopups() {
  // anchor:"top" fuerza a que el popup cuelgue hacia ABAJO del punto — si
  // no, por defecto puede aparecer arriba y tapar la nube 3D que flota
  // sobre la columna.
  sensorPopup = new mapboxgl.Popup({ closeButton: false, anchor: "top", offset: 12 });

  const canvas = map.getCanvas();
  canvas.addEventListener("mousemove", (e) => {
    const rect = canvas.getBoundingClientRect();
    mouseCanvasX = e.clientX - rect.left;
    mouseCanvasY = e.clientY - rect.top;
    if (render3DColumns) map.triggerRepaint(); // el hover se detecta al dibujar
  });
  canvas.addEventListener("mouseleave", () => {
    mouseCanvasX = null;
    mouseCanvasY = null;
    if (render3DColumns) map.triggerRepaint();
  });
}

function showSensorPopup(id) {
  const feature = lastSensorCollection?.features.find((f) => f.properties.id === id);
  if (!feature) return;
  const { name, aqi } = feature.properties;
  // Mismo color que la nube (gradientColorAt sobre COLUMN_GRADIENT), no el
  // de AQI_LEVELS — son dos paletas distintas y se veían desiguales.
  const tone = gradientColorAt(fractionForAqi(aqi));
  sensorPopup
    .setLngLat(feature.geometry.coordinates)
    .setHTML(`<div class="sensor-popup"><h3>${name}</h3></div>`)
    .addTo(map);

  // .mapboxgl-popup-content trae su fondo fijo por !important en
  // style.css — hay que ganarle con otro !important, cada vez que se abre
  // el popup (mismo patrón que el popup de estaciones de metro).
  const content = sensorPopup.getElement()?.querySelector(".mapboxgl-popup-content");
  content?.style.setProperty("background-color", tone, "important");
  const tip = sensorPopup.getElement()?.querySelector(".mapboxgl-popup-tip");
  tip?.style.setProperty("border-top-color", tone, "important");
  tip?.style.setProperty("border-bottom-color", tone, "important");
}

function hideSensorPopup() {
  sensorPopup.remove();
}

// --- Lupa circular sobre las estaciones de metro ---------------------------
// Un SEGUNDO mapa de Mapbox (sin interacción, recortado en círculo por CSS)
// centrado en la estación bajo el cursor, con más zoom que el principal.
// A diferencia de estirar los píxeles ya renderizados (borroso, como un
// zoom digital), esto vuelve a renderizar esa zona a mayor resolución real
// — el detalle es genuino, no una ampliación de pixeles existentes.
// MAGNIFIER_SIZE: diámetro del círculo en pantalla (px).
// MAGNIFIER_ZOOM_DELTA: cuántos niveles de zoom de más respecto al mapa
// principal — 2-3 es un buen acercamiento sin perder el contexto.
const MAGNIFIER_SIZE = 150;
const MAGNIFIER_ZOOM_DELTA = 3;

let magnifierEl, magnifierMap, magnifierReady;

function setupMagnifier() {
  magnifierEl = document.getElementById("magnifier");
  magnifierMap = new mapboxgl.Map({
    container: magnifierEl,
    style: MAP_STYLE,
    config: { basemap: STANDARD_CONFIG }, // que la lupa combine con el mapa principal
    center: map.getCenter(),
    zoom: map.getZoom() + MAGNIFIER_ZOOM_DELTA,
    interactive: false,
    attributionControl: false,
  });
  magnifierMap.on("load", () => {
    magnifierReady = true;
  });

}

// --- Número + calificación flotando sobre la nube 3D -----------------------
let cloudLabelEl, cloudLabelValueEl, cloudLabelTextEl;

function setupCloudLabel() {
  cloudLabelEl = document.getElementById("cloud-label");
  cloudLabelValueEl = document.getElementById("cloud-label-value");
  cloudLabelTextEl = document.getElementById("cloud-label-text");
}

// Proyecta un punto 3D (en coordenadas Mercator) a píxeles de pantalla,
// usando la misma matriz de proyección que Three.js recibe cada frame en
// render(gl, matrix) — es la única forma de saber dónde cae en pantalla un
// punto que no está al ras del suelo (map.project() solo sirve para lng/lat
// a nivel del terreno, no para algo flotando en el aire).
function projectMercatorToScreen(matrix, mercator, canvas) {
  const { x, y, z } = mercator;
  const clipW = matrix[3] * x + matrix[7] * y + matrix[11] * z + matrix[15];
  const clipX = (matrix[0] * x + matrix[4] * y + matrix[8] * z + matrix[12]) / clipW;
  const clipY = (matrix[1] * x + matrix[5] * y + matrix[9] * z + matrix[13]) / clipW;
  return {
    x: (clipX * 0.5 + 0.5) * canvas.clientWidth,
    y: (1 - (clipY * 0.5 + 0.5)) * canvas.clientHeight,
  };
}

// Proporción del ancho de la nube EN PANTALLA que ocupa cada línea de
// texto — edítalas para que el número/la calificación se vean más grandes
// o más chicas relativas a la nube.
const CLOUD_LABEL_VALUE_RATIO = 0.15;
const CLOUD_LABEL_TEXT_RATIO = 0.065;

function updateCloudLabel(matrix, mercator, aqi, angleDeg, screenWidth) {
  const canvas = map.getCanvas();
  const screen = projectMercatorToScreen(matrix, mercator, canvas);
  const rect = canvas.getBoundingClientRect();
  const level = levelForAqi(aqi);

  cloudLabelValueEl.textContent = aqi;
  cloudLabelValueEl.style.fontSize = `${screenWidth * CLOUD_LABEL_VALUE_RATIO}px`;
  cloudLabelTextEl.textContent = level.label;
  cloudLabelTextEl.style.fontSize = `${screenWidth * CLOUD_LABEL_TEXT_RATIO}px`;
  cloudLabelEl.style.left = `${rect.left + screen.x}px`;
  cloudLabelEl.style.top = `${rect.top + screen.y}px`;
  cloudLabelEl.style.transform = `translate(-50%, -50%) rotate(${angleDeg}deg)`;
  cloudLabelEl.style.display = "block";
}

function hideCloudLabel() {
  cloudLabelEl.style.display = "none";
}

function showMagnifierAt(lngLat, point, borderColor) {
  if (!magnifierReady) return;

  magnifierMap.jumpTo({ center: lngLat, zoom: map.getZoom() + MAGNIFIER_ZOOM_DELTA });

  const rect = map.getCanvas().getBoundingClientRect();
  magnifierEl.style.left = `${rect.left + point.x - MAGNIFIER_SIZE / 2}px`;
  magnifierEl.style.top = `${rect.top + point.y - MAGNIFIER_SIZE - 24}px`; // flotando arriba del cursor
  magnifierEl.style.borderColor = borderColor || "#ffffff";
  magnifierEl.style.visibility = "visible";
}

function hideMagnifier() {
  magnifierEl.style.visibility = "hidden";
}
// -----------------------------------------------------------------------

function wireMetroPopups() {
  // anchor:"top" fuerza a que el popup cuelgue HACIA ABAJO del cursor — la
  // lupa ya flota arriba (ver showMagnifierAt), así que sin esto ambos se
  // amontonan en el mismo lugar y se ven encimados.
  const popup = new mapboxgl.Popup({ closeButton: false, anchor: "top", offset: 16 });

  map.on("mousemove", "metro-stations-layer", (e) => {
    map.getCanvas().style.cursor = "pointer";
    const { name, lines } = e.features[0].properties;
    const lineNumbers = JSON.parse(lines);
    // Si la estación es de varias líneas, el borde toma el color de la
    // primera — no hay forma de mostrar dos colores en un solo borde.
    const lineColor = METRO_LINE_COLORS[lineNumbers[0]]?.color;
    showMagnifierAt(e.lngLat, e.point, lineColor);
    popup
      .setLngLat(e.lngLat)
      .setHTML(`<div class="sensor-popup"><h3>${name}</h3></div>`)
      .addTo(map);

    // .mapboxgl-popup-content trae su fondo fijo por !important en
    // style.css — para pintarlo distinto por línea hay que ganarle con
    // otro !important, uno por uno cada vez que se abre el popup.
    if (lineColor) {
      const content = popup.getElement()?.querySelector(".mapboxgl-popup-content");
      content?.style.setProperty("background-color", lineColor, "important");
      const tip = popup.getElement()?.querySelector(".mapboxgl-popup-tip");
      tip?.style.setProperty("border-top-color", lineColor, "important");
      tip?.style.setProperty("border-bottom-color", lineColor, "important");
    }
  });

  map.on("mouseleave", "metro-stations-layer", () => {
    map.getCanvas().style.cursor = "";
    hideMagnifier();
    popup.remove();
  });

  // Cursor de lupa al pasar sobre el trazado de una línea (no un popup,
  // solo el cambio de cursor).
  map.on("mousemove", "metro-lines-layer", () => {
    map.getCanvas().style.cursor = "zoom-in";
  });

  map.on("mouseleave", "metro-lines-layer", () => {
    map.getCanvas().style.cursor = "";
  });
}

function buildLegend() {
  const legend = document.getElementById("legend");
  legend.innerHTML = AQI_LEVELS.filter((l) => l.max !== Infinity || true)
    .map(
      (level, i) => `
      <div class="legend-row">
        <span class="legend-swatch" style="background:${level.color}"></span>
        <span>${level.label}</span>
      </div>`
    )
    .join("");
}

// Expresión de Mapbox que asigna, según el "ref" (1, 2, 3) de cada línea,
// el valor de esa propiedad ("color" u "opacity") desde METRO_LINE_COLORS
// — así colors.js manda, no el color/opacidad que trae metro.js desde
// OpenStreetMap.
function metroLineExpression(property, matchProperty = "ref") {
  const fallback = property === "opacity" ? 1 : "#ffffff";
  const stops = Object.entries(METRO_LINE_COLORS).flatMap(([ref, line]) => [ref, line[property]]);
  return ["match", ["get", matchProperty], ...stops, fallback];
}

// Explica que las líneas de colores y los puntos blancos del mapa son la
// red del Metrorrey (logo oficial, ver src/metroLogo.js), y qué color es
// cada línea (usa el mismo METRO_LINE_COLORS que pinta el mapa).
function buildMetroLegend() {
  const metroLegend = document.getElementById("metro-legend");
  const lineRows = Object.entries(METRO_LINE_COLORS)
    .map(
      ([ref, line]) => `
      <div class="legend-row">
        <span class="legend-swatch" style="background:${line.color}"></span>
        <span>Línea ${ref}</span>
      </div>`
    )
    .join("");

  metroLegend.innerHTML = `
    <div class="legend-row metro-legend-row">
      <img class="metro-legend-logo" src="${METRO_LOGO_DATA_URI}" alt="Metrorrey" />
      <span>Metro</span>
    </div>
    ${lineRows}`;
}

function setLayoutVisibility(layerId, visible) {
  if (map.getLayer(layerId)) map.setLayoutProperty(layerId, "visibility", visible ? "visible" : "none");
}

// Alterna entre el digital twin 3D (terreno, edificios, columnas+nube) y
// una vista 2D plana donde la única simbología es el ícono de nube por
// sensor (sensor-cloud-2d), coloreado con la misma expresión de AQI que ya
// usa el halo de la base — no hace falta la leyenda aparte en ese modo.
let is3DMode = false; // el mapa abre en 2D
// VIEW_3D_PITCH: inclinación de la cámara en 3D. Se bajó de 62 a 50: menos
// horizonte = menos mosaicos que cargar en el primer paso a 3D (se trababa).
const VIEW_3D_PITCH = 50;
// true mientras se ve la pantalla de inicio: el mapa no muestra sensores.
let introActive = true;
// false hasta que termina el vuelo a Monterrey de la intro: el halo no se ve
// durante ese zoom, solo cuando el usuario aleja después.
let haloUnlocked = false;
let terrainPreloaded = false;

// Activa el terreno plano para que Mapbox descargue y procese la elevación
// antes del primer paso a 3D (se llama al llegar a la vista 2D de la intro).
function preloadTerrain() {
  terrainPreloaded = true;
  if (!is3DMode) map.setTerrain({ source: "mapbox-dem", exaggeration: 0 });
}
// VIEW_TRANSITION_MS: duración (ms) del giro de cámara al cambiar entre 2D y 3D.
const VIEW_TRANSITION_MS = 2000;

function setViewMode(next3D) {
  is3DMode = next3D;
  render3DColumns = next3D;

  // En 2D el terreno se deja plano (exageración 0) en vez de apagarlo, una
  // vez precargado (ver preloadTerrain): así el paso a 3D no se traba
  // cargándolo. Antes de eso (el planeta de la intro) va apagado — con
  // terreno el vuelo desde el planeta se vuelve muy pesado.
  map.setTerrain(
    next3D ? { source: "mapbox-dem", exaggeration: TERRAIN_EXAGGERATION }
      : terrainPreloaded ? { source: "mapbox-dem", exaggeration: 0 }
      : null
  );
  updateSensorLayerVisibility();

  document.getElementById("legend").style.display = next3D ? "" : "none";
  document.getElementById("view-toggle").textContent = next3D ? "Ver en 2D" : "Ver en 3D";

  map.easeTo({ pitch: next3D ? VIEW_3D_PITCH : 0, bearing: next3D ? -20 : 0, duration: VIEW_TRANSITION_MS });
}

// Qué capas de sensores se ven según el modo. Durante la pantalla de inicio
// (introActive) no se ve nada, aunque se haga zoom a Monterrey.
function updateSensorLayerVisibility() {
  setLayoutVisibility("sensor-base", showHalo && haloUnlocked); // el halo funciona en 2D y en 3D
  setLayoutVisibility("sensor-cloud-2d", !is3DMode && !introActive);
}

// En 2D se puede seguir girando la dirección (arrastre, brújula, gesto de
// dos dedos) libremente, pero nunca inclinar la cámara — Mapbox acopla
// rotar+inclinar en una sola interacción sin forma limpia de separarlas,
// así que en vez de desactivar cada gesto, dejamos todos activos y
// forzamos el pitch de vuelta a 0 en cuanto se mueve, venga de donde venga.
map.on("pitch", () => {
  if (!is3DMode && map.getPitch() !== 0) map.setPitch(0);
});

let activeVariant = null;
let originalConfig = null; // la configuración original del estilo, para poder volver a ella

function setBasemapVariant(name) {
  // Guarda una sola vez el valor original de cada opción que tocan las variantes.
  originalConfig ??= Object.fromEntries(
    Object.values(BASEMAP_VARIANTS)
      .flatMap((v) => Object.keys(v.config))
      .map((key) => [key, map.getConfigProperty("basemap", key)])
  );
  activeVariant = name;
  // Primero vuelve todo a lo original y luego aplica la variante — así pasar
  // de una variante a otra no arrastra opciones de la anterior.
  const config = { ...originalConfig, ...(name ? BASEMAP_VARIANTS[name].config : {}) };
  const targets = magnifierReady ? [map, magnifierMap] : [map]; // la lupa también combina
  for (const target of targets) {
    for (const [key, value] of Object.entries(config)) target.setConfigProperty("basemap", key, value);
  }
  markActive("[data-variant]", (button) => (button.dataset.variant || null) === name);
}

function wireVariantToggles() {
  for (const button of document.querySelectorAll("[data-variant]")) {
    button.addEventListener("click", () => setBasemapVariant(button.dataset.variant || null));
  }
}

// Resalta (clase "active") los botones del selector que cumplan isActive.
function markActive(selector, isActive) {
  for (const button of document.querySelectorAll(selector)) button.classList.toggle("active", isActive(button));
}

// Muestra u oculta las nubes 3D sobre las columnas. Oculta el hover que
// hubiera en curso: su zona de detección cambia (nube <-> columna).
function setCloudsVisible(visible) {
  showClouds = visible;
  for (const { mesh } of Object.values(cloudMeshes)) mesh.visible = visible;
  if (hoveredSensorId) delete cloudHoverScale[hoveredSensorId];
  hoveredSensorId = null;
  hideSensorPopup();
  hideCloudLabel();
  document.getElementById("cloud-toggle").classList.toggle("active", visible);
  map.triggerRepaint();
}

// Cada forma tiene un botón en el grupo "Forma de columnas" (data-shape).
function setColumnShape(shape) {
  columnShape = shape;
  if (lastSensorCollection) updateColumnMeshes(lastSensorCollection); // rehace todas las columnas
  markActive("[data-shape]", (button) => button.dataset.shape === shape);
}

function wireShapeToggle() {
  for (const button of document.querySelectorAll("[data-shape]")) {
    button.addEventListener("click", () => setColumnShape(button.dataset.shape));
  }
}

function setHaloVisible(visible) {
  showHalo = visible;
  updateSensorLayerVisibility();
  document.getElementById("halo-toggle").classList.toggle("active", visible);
}

// Muestra u oculta las columnas (cualquier forma). Las nubes flotantes, si
// están encendidas, se quedan en su lugar.
function setColumnsVisible(visible) {
  showColumns = visible;
  // No se usa mesh.visible = false: si Three.js deja de dibujar las
  // columnas, las nubes también dejan de verse (probado). En cambio se
  // siguen dibujando sin escribir color ni profundidad: invisibles y sin
  // tapar nada.
  for (const { mesh, stack } of Object.values(columnMeshes)) {
    for (const material of [mesh.material, stack.material]) {
      material.colorWrite = visible;
      material.depthWrite = visible;
    }
  }
  if (!visible && !showClouds && hoveredSensorId) {
    hoveredSensorId = null; // sin columnas ni nubes no queda nada sobre qué hacer hover
    hideSensorPopup();
  }
  document.getElementById("column-toggle").classList.toggle("active", visible);
  map.triggerRepaint();
}

function wireColumnToggle() {
  document.getElementById("column-toggle").addEventListener("click", () => setColumnsVisible(!showColumns));
}

// Enciende o apaga las líneas y estaciones del metro con su leyenda. Una
// capa oculta tampoco dispara hover, así que la lupa se apaga sola.
let showMetro = false; // apagado al abrir el mapa; el botón "Metro" lo enciende

function setMetroVisible(visible) {
  showMetro = visible;
  setLayoutVisibility("metro-lines-layer", visible);
  setLayoutVisibility("metro-stations-layer", visible);
  document.getElementById("metro-legend").style.display = visible ? "" : "none";
  if (!visible) hideMagnifier();
  document.getElementById("metro-toggle").classList.toggle("active", visible);
}

function wireMetroToggle() {
  document.getElementById("metro-toggle").addEventListener("click", () => setMetroVisible(!showMetro));
}

function wireHaloToggle() {
  document.getElementById("halo-toggle").addEventListener("click", () => setHaloVisible(!showHalo));
}

function wireCloudToggle() {
  document.getElementById("cloud-toggle").addEventListener("click", () => setCloudsVisible(!showClouds));
}

function wireViewToggle() {
  document.getElementById("view-toggle").addEventListener("click", () => setViewMode(!is3DMode));
}

// --- Pantalla de inicio: planeta -> Mi ubicación -> (clic) Monterrey 2D -> (clic) 3D
const wait = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

// El mismo ícono de ubicación del botón (FIGURAS/miaire_botones.svg), para
// "Ubicación encontrada". Su color está en style.css (.intro-pin).
const LOCATION_PIN_SVG = `<svg class="intro-pin" viewBox="82.9 58.3 35.7 47.4" aria-hidden="true"><path d="M100.73,58.99c-9.52,0-17.13,7.61-17.13,17.13,0,12.18,17.13,28.55,17.13,28.55,0,0,17.13-16.37,17.13-28.55,0-9.52-7.61-17.13-17.13-17.13ZM100.73,81.83c-3.15,0-5.71-2.56-5.71-5.71s2.56-5.71,5.71-5.71,5.71,2.56,5.71,5.71-2.56,5.71-5.71,5.71Z"/></svg>`;

// Cada paso de la intro avanza con un clic en cualquier lugar; mientras
// tanto se muestra abajo el aviso con lo que sigue.
async function waitForClick(message) {
  const hint = document.getElementById("step-hint");
  hint.textContent = message;
  hint.classList.add("visible");
  await new Promise((resolve) => document.addEventListener("click", resolve, { once: true }));
  hint.classList.remove("visible");
}

async function startIntroSequence() {
  const button = document.getElementById("intro-locate");
  button.disabled = true;
  // De aquí en adelante el botón muestra texto (el estado) en vez de la imagen.
  button.classList.remove("intro-button--image");
  button.textContent = "Obteniendo tu ubicación…";
  await wait(INTRO_LOCATING_MS);

  // "Obtiene" la ubicación y pinta el espacio con el sensor más cercano.
  userLngLat = SIMULATED_LOCATION;
  if (lastSensorCollection) updateSpaceColor(lastSensorCollection);
  button.innerHTML = `${LOCATION_PIN_SVG}<span>Ubicación encontrada</span>`;
  await waitForClick("Haz clic para ir a Monterrey");

  // Zoom a la ciudad en 2D, encuadrando todos los sensores (nunca por debajo
  // del zoom en que aparecen las nubes 2D).
  document.getElementById("intro").classList.add("hidden");
  introActive = false;
  updateSensorLayerVisibility(); // aparecen las nubes 2D durante el vuelo
  const bounds = new mapboxgl.LngLatBounds();
  for (const site of SENSOR_SITES) bounds.extend(site.coords);
  const noPadding = { top: 0, right: 0, bottom: 0, left: 0 };
  map.setPadding(noPadding);
  const camera = map.cameraForBounds(bounds, { padding: 80 });
  map.flyTo({
    padding: noPadding,
    center: camera.center,
    zoom: Math.max(camera.zoom, CLOUD_2D_MIN_ZOOM + 0.2),
    pitch: 0,
    bearing: 0,
    duration: INTRO_FLY_MS,
    essential: true,
  });
  await new Promise((resolve) => map.once("moveend", resolve));
  haloUnlocked = true; // ya en la ciudad: el halo aparecerá solo si se aleja
  updateSensorLayerVisibility();
  preloadTerrain(); // mientras se ve la vista 2D, deja listo el relieve del 3D
  await waitForClick("Haz clic para ver en 3D");

  // Pasa a 3D y aparece el panel.
  setViewMode(true);
  document.getElementById("panel").classList.remove("hidden");
}

document.getElementById("intro-locate").addEventListener("click", startIntroSequence);
    </script>
