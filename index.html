<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Monterrey Air Quality — Digital Twin</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" />
    <link rel="stylesheet" href="https://api.mapbox.com/mapbox-gl-js/v3.26.0/mapbox-gl.css" />
    <script src="https://api.mapbox.com/mapbox-gl-js/v3.26.0/mapbox-gl.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.149.0/build/three.min.js"></script>
    <style>
/* ---------------------------------------------------------------------------
   TODOS los colores de la interfaz (panel, leyenda, popups) viven aquí abajo.
   Cambia un valor y se refleja en toda la página. Los colores del MAPA
   (calles, agua, edificios, AQI) están en src/colors.js, no aquí.
--------------------------------------------------------------------------- */
:root {
  --body-bg: #0b0e14;
  --panel-bg: rgba(15, 18, 26, 0.85);
  --panel-border: rgba(255, 255, 255, 0.08);
  --panel-shadow: rgba(0, 0, 0, 0.35);
  --text-primary: #eef1f6;
  --text-subtitle: #9aa5b6;
  --text-legend: #cbd3e0;
  --text-status: #7d8aa0;
  --popup-bg: #12151d;
  --space-neutral: #f4f4f4; /* fondo detrás del mapa (mapas base claros) */
  /* Fondo de #map al abrir, mientras el mapa aún no aparece: ≈ el tono
     promedio del mapa base inicial ("studio", Dark 2D), para que no destelle
     claro. Luego main.js lo ajusta según el mapa base (updateStudioTint). */
  --map-loading-bg: rgb(45, 48, 64);
  --intro-text: #1c1f26;
  /* Color de los botones de la intro. Empieza azul; al encontrar la ubicación
     main.js lo cambia al color del sensor más cercano (updateLocationColor). */
  --intro-accent: #434649; /* gris oscuro al abrir (antes azul #2a6ac2) */
  --intro-on-accent: #ffffff; /* texto encima del color (main.js lo oscurece si el color es claro) */
  /* Tono oscuro del logo con el matiz del sensor más cercano (main.js): color
     del aviso "Haz clic para…". Empieza en el azul marino del logo. */
  --intro-accent-dark: #222855;
  /* Mismo color del sensor más cercano, como "r, g, b" para poder darle
     transparencia: lo usa el fondo del panel. main.js lo actualiza. */
  --location-rgb: 255, 255, 255;
  --panel-tint-alpha: 0.45; /* opacidad del color de fondo del panel (0 a 1) */
  --panel-blur: 18px; /* desenfoque del mapa detrás del panel */
  /* --location-cursor: flecha del mouse del color del sensor más cercano
     (main.js, arrowCursorCss). */
}

/* Cursor del color de la ubicación en toda la página, también sobre el mapa
   (en lugar de la manita de arrastrar de Mapbox). Al pasar sobre una nube o
   estación sigue apareciendo la mano normal, para saber que se puede hacer clic. */
html, body,
#map .mapboxgl-canvas-container.mapboxgl-interactive,
#map .mapboxgl-canvas-container.mapboxgl-interactive:active {
  cursor: var(--location-cursor, auto);
}

/* Tarjeta del sensor detectado (pantalla de inicio), del diseño
   FIGURAS/sensor aire highlight_sin_monito.svg. Todo se mide en --u =
   1/253 del ancho de la tarjeta (las unidades del diseño); main.js pone el
   ancho (SENSOR_CARD_WIDTH) y --u. */
#sensor-card {
  --u: calc(270px / 253);
  position: absolute;
  z-index: 2;
  aspect-ratio: 253 / 175;
  border-radius: calc(12.7 * var(--u));
  color: #ffffff;
  background-color: var(--card-color, #a52a8b);
  background-image: linear-gradient(rgba(255, 224, 224, 0.2), rgba(255, 224, 224, 0.2));
  box-shadow: 0 10px 28px rgba(0, 0, 0, 0.28);
  font-family: "Manrope", system-ui, -apple-system, sans-serif;
  pointer-events: none;
  opacity: 0;
  transform: translateY(8px);
  transition: opacity 0.5s ease, transform 0.5s ease, background-color 0.8s ease;
}
#sensor-card.visible {
  opacity: 1;
  transform: none;
}
#sensor-card > * {
  position: absolute;
  left: calc(16 * var(--u));
  white-space: nowrap;
}
#sensor-card .sc-name {
  top: calc(18 * var(--u));
  max-width: calc(112 * var(--u));
  overflow: hidden;
  text-overflow: ellipsis;
  font-size: calc(8.4 * var(--u));
  font-weight: 600;
}
#sensor-card .sc-place {
  top: calc(33 * var(--u));
  max-width: calc(112 * var(--u));
  overflow: hidden;
  text-overflow: ellipsis;
  font-size: calc(7.4 * var(--u));
  opacity: 0.6;
}
#sensor-card .sc-title {
  top: calc(52 * var(--u));
  font-size: calc(16.5 * var(--u));
  line-height: 1.22;
  letter-spacing: -0.01em;
}
#sensor-card .sc-title strong {
  font-weight: 800;
}
#sensor-card .sc-pill {
  top: calc(103 * var(--u));
  padding: calc(5 * var(--u)) calc(12 * var(--u));
  font-size: calc(12.5 * var(--u));
  font-weight: 700;
  color: var(--card-color, #a52a8b);
  background: #ffffff;
  border-radius: 999px;
}
#sensor-card .sc-value {
  top: calc(152 * var(--u));
  display: flex;
  align-items: center;
  gap: calc(6 * var(--u));
  font-size: calc(7 * var(--u));
}
#sensor-card .sc-info {
  position: static;
  display: inline-grid;
  place-items: center;
  width: calc(10 * var(--u));
  height: calc(10 * var(--u));
  border-radius: 50%;
  background: #ffffff;
  color: var(--card-color, #a52a8b);
  font-weight: 800;
}
#sensor-card > * {
  z-index: 1; /* el texto va encima del monito, como en el diseño */
}
#sensor-card .sc-monito {
  z-index: 0;
  height: auto;
}

/* Botones +, − y norte (NavigationControl): fondo blanco, contorno e íconos
   del color de la ubicación (--intro-accent: gris #434649 al abrir, luego el color
   del sensor más cercano), como el botón "Usar mi ubicación". Los íconos de
   Mapbox son imágenes grises; main.js (tintNavIcons) las vuelve máscara para
   pintarlas con ese color. */
#map .mapboxgl-ctrl-group {
  background: #ffffff;
  border: 1.5px solid var(--intro-accent);
  box-shadow: none;
  transition: border-color 0.8s ease;
}
#map .mapboxgl-ctrl-group button + button {
  border-top: 1px solid var(--intro-accent);
  transition: border-color 0.8s ease;
}
#map .mapboxgl-ctrl-group .mapboxgl-ctrl-icon.tinted {
  background-color: var(--intro-accent);
  -webkit-mask-repeat: no-repeat;
  mask-repeat: no-repeat;
  -webkit-mask-position: center;
  mask-position: center;
  transition: background-color 0.8s ease;
}

html, body {
  margin: 0;
  padding: 0;
  height: 100%;
  width: 100%;
  font-family: "Manrope", system-ui, -apple-system, sans-serif;
  background: var(--body-bg);
}

/* El mapa aparece con un fundido cuando ya tiene los colores del mapa base
   (main.js le pone "map-ready"); antes solo se ve el fondo de #map. */
#map .mapboxgl-canvas {
  opacity: 0;
  transition: opacity 0.5s ease;
}
#map.map-ready .mapboxgl-canvas {
  opacity: 1;
}

#map {
  position: absolute;
  inset: 0;
  background: var(--map-loading-bg);
  transition: background-color 1.2s ease; /* el espacio se tiñe suave al ubicarte */
}

/* --- Pantalla de inicio ("MiAire", debajo del planeta) ------------------- */
#intro {
  position: absolute;
  left: 50%;
  bottom: 7%;
  transform: translateX(-50%);
  z-index: 2;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 12px;
  color: var(--intro-text);
  transition: opacity 0.6s ease;
}
#intro.hidden {
  opacity: 0;
  pointer-events: none;
}
/* Texto de la pantalla de inicio, arriba a la izquierda (diseño de Luisa a
   1440 px de ancho: FIGURAS/texto_main_azul.svg). Todo escala con el ancho
   de la pantalla; --intro-copy-width es el ancho del título. */
#intro-copy {
  --intro-copy-width: clamp(260px, 41.5vw, 800px);
  position: absolute;
  left: clamp(16px, 4.4vw, 64px);
  top: clamp(24px, 11.8vh, 120px);
  z-index: 2;
  width: min(var(--intro-copy-width), calc(100vw - 32px));
  pointer-events: none;
  transition: opacity 0.6s ease;
}
#intro-copy.hidden {
  opacity: 0;
}
/* Degradado oscuro suave detrás del texto, para que se lea sobre el mapa.
   Se desvanece hacia afuera (no se ve una caja). --intro-copy-shade: qué tan
   oscuro es en el centro (0 a 1). */
#intro-copy::before {
  --intro-copy-shade: 0.55;
  content: "";
  position: absolute;
  z-index: -1;
  left: -30%;
  top: -60%;
  width: 170%;
  height: 230%;
  background: radial-gradient(ellipse at 35% 45%, rgba(18, 20, 32, var(--intro-copy-shade)) 0%, rgba(18, 20, 32, calc(var(--intro-copy-shade) * 0.6)) 40%, rgba(18, 20, 32, 0) 70%);
  pointer-events: none;
}
#intro-copy img {
  display: block;
  height: auto;
}
.intro-copy-title {
  width: 100%;
}
.intro-copy-text {
  width: 72%; /* 432 / 597 del diseño */
  margin-top: 4.3%; /* separación título-párrafo del diseño (26 / 597) */
}
/* "Pasa el cursor por cualquier sensor", abajo a la derecha. Se queda
   también después de la intro, cuando ya hay sensores. */
#cursor-hint {
  position: absolute;
  right: clamp(16px, 9.5vw, 140px);
  bottom: clamp(16px, 6.3vh, 60px);
  z-index: 2;
  width: clamp(150px, 14.4vw, 280px);
  height: auto;
  pointer-events: none;
}

/* Aviso de la intro: "Haz clic para…" (cada paso avanza con un clic).
   Solo letras, sin fondo, en blanco con una sombra suave para leerse sobre el mapa. */
#step-hint {
  position: absolute;
  left: 50%;
  bottom: 22px;
  transform: translateX(-50%);
  z-index: 3;
  margin: 0;
  padding: 8px 16px;
  font-family: "Manrope", system-ui, -apple-system, sans-serif;
  font-size: 15px;
  font-weight: 700;
  color: #ffffff; /* blanco: se lee sobre el mapa oscuro (antes --intro-accent-dark) */
  text-shadow: 0 1px 4px rgba(0, 0, 0, 0.6);
  background: none;
  pointer-events: none;
  opacity: 0;
  transition: opacity 0.6s ease;
}
#step-hint.visible {
  opacity: 0.75;
  animation: intro-pulse 1.8s ease-in-out infinite;
}
/* Pulso de tamaño (no de transparencia: el aviso siempre al 75%) */
@keyframes intro-pulse {
  50% { transform: translateX(-50%) scale(1.06); }
}
.intro-button {
  width: 220px;
  padding: 10px 14px;
  font-family: inherit;
  font-size: 14px;
  font-weight: 600;
  border-radius: 999px;
  cursor: pointer;
  /* el color cambia con el sensor más cercano: que el cambio sea suave */
  transition: color 0.8s ease, background-color 0.8s ease, border-color 0.8s ease;
}
/* Botón "Mi ubicación": la imagen FIGURAS/miaire_boton_blanco.svg (pastilla
   blanca, texto azul); al presionarlo pasa a mostrar el estado como texto,
   también en blanco, con letras en el tono oscuro del color del sensor
   (--intro-accent-dark: se lee sobre blanco aunque el sensor sea amarillo). */
.intro-button {
  height: 54px; /* = alto de la imagen a 220px de ancho, para que no "brinque" al cambiar a texto */
  color: var(--intro-accent); /* letras y pin del color del sensor más cercano */
  background: #ffffff;
  border: none;
}
/* Ícono de ubicación en "Ubicación encontrada" (mismo trazo que el SVG del botón) */
.intro-button {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
}
.intro-pin {
  width: 14px;
  height: auto;
  fill: none;
  stroke: currentColor; /* mismo color que el texto del botón */
  stroke-width: 1.4px;
}
.intro-button--image {
  padding: 0;
  background: none;
}
.intro-button--image img {
  display: block;
  width: 100%;
  height: auto;
}
.intro-button--image:hover img {
  filter: brightness(1.08);
}
.intro-button:disabled {
  cursor: progress;
}
#panel {
  transition: opacity 0.6s ease, background-color 0.8s ease;
}
#panel.hidden {
  opacity: 0;
  pointer-events: none;
}

#magnifier {
  position: fixed;
  width: 150px;
  height: 150px;
  border-radius: 50%;
  overflow: hidden;
  pointer-events: none;
  /* visibility, no display:none — Mapbox necesita medir el tamaño del
     contenedor incluso mientras está oculta, si no el mini-mapa dentro
     queda mal dimensionado la primera vez que se muestra. */
  visibility: hidden;
  z-index: 5;
  border: 3px solid rgba(255, 255, 255, 0.9);
  box-shadow: 0 2px 8px rgba(0, 0, 0, 0.35);
}

/* El círculo es tan chico que el logo de Mapbox (esquina inferior) no
   queda bien recortado por el overflow:hidden de arriba y se asoma como
   una caja oscura — lo ocultamos solo en la lupa, no en el mapa principal. */
#magnifier .mapboxgl-ctrl-logo,
#magnifier .mapboxgl-ctrl-bottom-left,
#magnifier .mapboxgl-ctrl-bottom-right {
  display: none !important;
}

/* Número + calificación de AQI flotando sobre la nube 3D — su posición se
   recalcula cada frame en render() (proyectando su posición 3D a pantalla),
   así que solo left/top/display cambian por JS; el resto es estático. */
#cloud-label {
  position: fixed;
  display: none;
  transform: translate(-50%, -50%); /* centrado en el punto, no colgando arriba — así cae dentro de la nube */
  pointer-events: none;
  z-index: 4;
  text-align: center;
  font-family: inherit;
  color: #ffffff;
}

#cloud-label-value {
  font-size: 26px;
  font-weight: 700;
  line-height: 1;
}

#cloud-label-text {
  font-size: 12px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.03em;
}

/* Panel: fondo del color de la calidad del aire del sensor más cercano,
   semitransparente y con el mapa de atrás desenfocado. Encima de ese color
   (claro) los textos van oscuros: se redefinen aquí sus variables. */
#panel {
  --text-primary: #1c1f26;
  --text-subtitle: rgba(28, 31, 38, 0.68);
  --text-legend: #1c1f26;
  --text-status: rgba(28, 31, 38, 0.6);
  --panel-border: rgba(28, 31, 38, 0.12);
  position: absolute;
  top: 16px;
  left: 16px;
  z-index: 1;
  background: rgba(var(--location-rgb), var(--panel-tint-alpha));
  backdrop-filter: blur(var(--panel-blur)) saturate(1.3);
  -webkit-backdrop-filter: blur(var(--panel-blur)) saturate(1.3);
  border: 1px solid rgba(255, 255, 255, 0.45);
  border-radius: 12px;
  padding: 16px 20px;
  color: var(--text-primary);
  width: 260px;
  box-shadow: 0 8px 24px var(--panel-shadow);
}

#panel h1 {
  margin: 0;
  font-size: 16px;
  font-weight: 600;
}

.subtitle {
  margin: 2px 0 12px;
  font-size: 12px;
  color: var(--text-subtitle);
}

.toggle-btn {
  display: block;
  width: 100%;
  margin-bottom: 8px;
  padding: 6px 10px;
  font-size: 12px;
  font-family: inherit;
  font-weight: 600;
  color: var(--text-primary);
  background: rgba(255, 255, 255, 0.3);
  border: 1px solid var(--panel-border);
  border-radius: 6px;
  cursor: pointer;
}

.toggle-btn:last-of-type {
  margin-bottom: 12px;
}

.toggle-btn:hover {
  background: rgba(255, 255, 255, 0.5);
}

/* Botón encendido / modo elegido */
.toggle-btn.active {
  background: #ffffff;
  color: #11141b;
  border-color: transparent;
  box-shadow: 0 1px 4px rgba(0, 0, 0, 0.12);
}

/* Título de cada grupo de botones del panel */
.control-label {
  margin: 12px 0 6px;
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--text-subtitle);
}

/* Grupo de botones en rejilla de 2 columnas */
.mode-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 6px;
}
.mode-grid.last {
  margin-bottom: 12px;
}
.mode-grid .toggle-btn {
  margin: 0;
  padding: 6px 4px;
  line-height: 1.25;
}

#legend {
  display: flex;
  flex-direction: column;
  gap: 6px;
  margin-bottom: 12px;
}

.legend-row {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 12px;
  color: var(--text-legend);
}

.legend-swatch {
  width: 12px;
  height: 12px;
  border-radius: 3px;
  flex: none;
}

#metro-legend {
  margin-bottom: 12px;
}

.metro-legend-row {
  font-size: 12px;
}

.metro-legend-logo {
  width: 20px;
  height: 20px;
  flex: none;
}

#status {
  font-size: 11px;
  color: var(--text-status);
  border-top: 1px solid var(--panel-border);
  padding-top: 8px;
}

.sensor-popup {
  font-family: inherit;
}

.sensor-popup h3 {
  margin: 0;
  font-size: 14px;
  text-align: center;
}

.sensor-popup .aqi-value {
  font-size: 22px;
  font-weight: 700;
}

.sensor-popup .aqi-label {
  font-size: 12px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.03em;
}

.mapboxgl-popup-content {
  background: var(--popup-bg) !important;
  color: var(--text-primary) !important;
  border-radius: 10px !important;
  /* Mapbox trae padding asimétrico por defecto (más abajo, para el botón
     de cerrar) — como no usamos ese botón, lo dejamos parejo. */
  padding: 10px 14px !important;
  /* Mapbox por defecto limita el popup a max-width:240px con ancho fijo —
     esto lo deja ajustarse al texto (nombres cortos quedan angostos,
     largos se envuelven en vez de forzar una caja ancha vacía). */
  width: max-content !important;
  max-width: 240px !important;
}

.mapboxgl-popup-tip {
  border-top-color: var(--popup-bg) !important;
  border-bottom-color: var(--popup-bg) !important;
}

/* Popups y controles de Mapbox también en Manrope (Mapbox trae su propia fuente) */
.mapboxgl-map,
.mapboxgl-popup-content {
  font-family: "Manrope", system-ui, -apple-system, sans-serif;
}

    </style>
  </head>
  <body>
    <div id="map"></div>

    <div id="magnifier"></div>

    <div id="cloud-label">
      <div id="cloud-label-value"></div>
      <div id="cloud-label-text"></div>

// ===== colors.js =====

// ---------------------------------------------------------------------------
// TODOS los colores del mapa viven aquí. Cambia un valor y se refleja en
// toda la app (main.js y aqi.js importan de este archivo).
// Los colores del panel/UI (texto, fondos de tarjeta, etc.) están en
// style.css, arriba del todo, como variables CSS (--nombre: #hex).
// ---------------------------------------------------------------------------

// Gradiente vertical de las columnas 3D de sensores: de la base (buena
// calidad) a la punta (peligrosa). Usado por aqi.js para interpolar el color
// de cada franja de una columna y para el color del halo en el suelo.
const COLUMN_GRADIENT = ["#00CE93", "#FAC131", "#E4283F", "#A52A8B"];

// Categorías de calidad del aire: umbral máximo, etiqueta y color fijo (la
// paleta oficial de MiAire). Estos 5 colores son los únicos que usan la
// leyenda, los botones de la intro, el panel y el logo (este último toma su
// matiz). Las nubes y columnas siguen con el degradado COLUMN_GRADIENT.
const AQI_LEVELS = [
  { max: 50, label: "Bueno", color: "#00CE93" },
  { max: 100, label: "Aceptable", color: "#FAC131" },
  { max: 150, label: "Malo", color: "#FF7E22" },
  { max: 200, label: "Muy malo", color: "#E4283F" },
  { max: Infinity, label: "Extremadamente malo", color: "#A52A8B" },
];

// Color y opacidad de cada línea del Metrorrey en el mapa (independiente
// del color que traiga metro.js desde OpenStreetMap — este es el que se
// usa de verdad). La llave es el "ref" de la línea (1, 2, 3).
// "color" siempre hex de 6 dígitos (sin alfa: "#RRGGBB", NUNCA
// "#RRGGBBAA" — Mapbox no lo soporta ahí y la línea desaparece en vez de
// verse translúcida). "opacity" es el número que controla la transparencia,
// de 0 (invisible) a 1 (sólida).
const METRO_LINE_COLORS = {
  "1": { color: "#F9B136", opacity: 0.40 },
  "2": { color: "#3BA85F", opacity: 0.40 },
  "3": { color: "#D70217", opacity: 0.40 },
};

// Colores del mapa base (Mapbox Standard) para la versión "Agua y verdes ·
// color" del panel. Los nombres son las opciones de configuración
// de Standard (docs.mapbox.com/map-styles/standard/api).
//
// Agua y áreas verdes.
const WATER_GREEN_COLORS = {
  colorWater: "hsl(200, 22%, 89%)",
  colorGreenspace: "hsl(115, 13%, 97%)",
};

// Todo lo demás en grises, para la versión "a color": imita el tema
// monocromático, pero sin su filtro de grises (que también le quitaría el
// tono al agua y las áreas verdes).
const GRAY_BASEMAP_COLORS = {
  colorLand: "hsl(0, 0%, 97%)",
  colorRoads: "hsl(0, 0%, 86%)",
  colorTrunks: "hsl(0, 0%, 80%)",
  colorMotorways: "hsl(0, 0%, 78%)",
  colorBuildings: "hsl(0, 0%, 92%)",
  colorCommercial: "hsl(0, 0%, 94%)",
  colorEducation: "hsl(0, 0%, 93%)",
  colorIndustrial: "hsl(0, 0%, 92%)",
  colorMedical: "hsl(0, 0%, 94%)",
  colorAdminBoundaries: "hsl(0, 0%, 65%)",
  colorPlaceLabels: "hsl(0, 0%, 25%)",
  colorRoadLabels: "hsl(0, 0%, 40%)",
  colorPointOfInterestLabels: "hsl(0, 0%, 50%)",
};

// Sombreado del relieve (hillshade): montañas y cerros con luz y sombra.
// "shadow" = laderas en sombra, "highlight" = laderas iluminadas, "accent" =
// valles y quiebres fuertes (rgba: el 4to valor es la opacidad, 0 a 1).
// "exaggeration" = qué tan marcado, de 0 a 1. Hay dos juegos de valores: a
// escala país ("country", más marcado para que se lean las sierras) y a
// escala ciudad ("city"); entre los dos zooms de "zooms" se mezclan.
const HILLSHADE = {
  zooms: [5, 9],
  // A escala país el relieve va ENCIMA del color de calidad del aire: los
  // brillos blancos lo "lavan" (se ve pastel), por eso highlight casi en 0.
  country: {
    shadow: "rgba(45, 45, 60, 0.4)",
    highlight: "rgba(255, 255, 255, 0.08)",
    accent: "rgba(45, 45, 60, 0.15)",
    exaggeration: 1,
  },
  city: {
    shadow: "rgba(60, 60, 70, 0.35)",
    highlight: "rgba(255, 255, 255, 0.25)",
    accent: "rgba(60, 60, 70, 0.15)",
    exaggeration: 0.5,
  },
  // Con el mapa base "studio" (oscuro, luz de noche): reemplaza highlight y
  // exaggeration a escala ciudad para que las laderas iluminadas se lean.
  // Además ahí el sombreado no depende de la luz de noche de Mapbox
  // (hillshade-emissive-strength 1); sin eso casi no se veía (2026-09-30).
  // highlight: más alto = laderas más claras. exaggeration: 0 a 1, más alto
  // = relieve más marcado.
  studio: {
    highlight: "rgba(255, 255, 255, 0.55)",
    exaggeration: 1,
  },
  // Con el mapa base "studio" y el relieve activo (3D): con relieve, Mapbox
  // dibuja el sombreado más claro (el mapa se veía más claro y azulado que
  // en 2D). Con la luz al 40% el tono promedio queda igual que el 2D (medido
  // 2026-09-30: 2D [49,51,69], 3D con 0.55 [53,55,73], con 0.40 [49,51,69]).
  studio3d: {
    highlight: "rgba(255, 255, 255, 0.4)",
  },
};

// ===== aqi.js =====

// Colores centralizados en colors.js — edítalos ahí.

function levelForAqi(aqi) {
  return AQI_LEVELS.find((level) => aqi <= level.max) ?? AQI_LEVELS.at(-1);
}

// Mapbox expression: interpolates the ground halo color by AQI, using the
// same 4 stops as the vertical column gradient (COLUMN_GRADIENT).
function aqiGradientExpression() {
  const [good, moderate, bad, hazardous] = COLUMN_GRADIENT;
  return [
    "interpolate",
    ["linear"],
    ["get", "aqi"],
    0, good,
    100, moderate,
    200, bad,
    300, hazardous,
  ];
}

// Fraction (0-1) of the AQI scale, capped at 300 — shared by column height
// and column gradient so a short (low-AQI) column only samples the green
// end of COLUMN_GRADIENT, while a maxed-out column spans the full gradient.
function fractionForAqi(aqi) {
  return Math.min(aqi, 300) / 300;
}

// Column height (meters) scaled by AQI, capped for visual sanity.
function heightForAqi(aqi) {
  return fractionForAqi(aqi) * 1800;
}

function hexToRgb(hex) {
  const int = parseInt(hex.replace("#", ""), 16);
  return [(int >> 16) & 255, (int >> 8) & 255, int & 255];
}

function rgbToHex([r, g, b]) {
  return "#" + [r, g, b].map((c) => Math.round(c).toString(16).padStart(2, "0")).join("");
}

// Interpolates a color across COLUMN_GRADIENT's stops at position t (0-1).
function gradientColorAt(t) {
  const clamped = Math.max(0, Math.min(1, t));
  const segment = 1 / (COLUMN_GRADIENT.length - 1);
  const i = Math.min(COLUMN_GRADIENT.length - 2, Math.floor(clamped / segment));
  const localT = (clamped - i * segment) / segment;
  const a = hexToRgb(COLUMN_GRADIENT[i]);
  const b = hexToRgb(COLUMN_GRADIENT[i + 1]);
  return rgbToHex(a.map((channel, idx) => channel + (b[idx] - channel) * localT));
}

// Same as gradientColorAt but returns normalized [r, g, b] (0-1 floats) —
// what WebGL/Three.js vertex colors expect, straight from the interpolated
// hex without an extra string round-trip.
function gradientRgbAt(t) {
  const [r, g, b] = hexToRgb(gradientColorAt(t));
  return [r / 255, g / 255, b / 255];
}

// ===== sensorSites.js =====

// Generado por scripts/fetch_sensors.py a partir del Google My Maps
// "Mapa Sensores PA" (mid=11lmUHNiiYd6ys2eFbXbvOkAxSRWXZY0) -- ubicaciones reales de sensores de
// Monterrey (TEC de Monterrey, Clarity y la red ciudadana PA). El AQI que
// se les asigna sigue siendo simulado (ver startMockFeed en sensors.js);
// este archivo solo trae nombre + coordenadas reales.
// Vuelve a correr ese script si el mapa cambia.

const REAL_SENSOR_SITES = [
  { id: "prepatec-valle-alto-nivel-5", name: "PrepaTec Valle Alto Nivel 5", source: "Ubicacion sensores TEC", coords: [-100.249001, 25.570206] },
  { id: "casa-naranjos", name: "Casa Naranjos", source: "Ubicacion sensores TEC", coords: [-100.289768, 25.654311] },

// ===== sensors.js =====

// Ubicaciones reales de sensores (TEC de Monterrey, Clarity, red ciudadana
// PA — ver scripts/fetch_sensors.py). El AQI que se les asigna abajo sigue
// siendo simulado (random walk): reemplaza `startMockFeed` con una
// suscripción real (WebSocket/MQTT/REST) cuando haya lecturas en vivo — el
// contrato (`onUpdate(features)`) es todo lo que main.js depende de esto,
// así que cambiar la fuente no toca código del mapa.

const SENSOR_SITES = REAL_SENSOR_SITES;

// Estilo de nube de cada sensor: "filled" (rellena) o "outline" (contorno),
// dibujos de FIGURAS/miaire_nubes_tipos.svg. Servirán para distinguir tipos
// de sensor; POR AHORA es al azar (Luisa, 2026-09-30), pero fijo por sensor
// (sale de su id), para que no cambie al recargar la página.
function cloudStyleFor(siteId) {
  let hash = 0;
  for (const char of siteId) hash = (hash * 31 + char.charCodeAt(0)) >>> 0;
  return hash % 2 === 0 ? "filled" : "outline";
}

function randomWalk(value, min, max, step) {
  const next = value + (Math.random() - 0.5) * step;
  return Math.max(min, Math.min(max, next));
}

function toFeatureCollection(state) {
  return {
    type: "FeatureCollection",
    features: SENSOR_SITES.map((site) => ({
      type: "Feature",
      id: site.id,
      geometry: { type: "Point", coordinates: site.coords },
      properties: {
        id: site.id,
        name: site.name,
        aqi: Math.round(state[site.id]),
        cloudStyle: cloudStyleFor(site.id),
        updatedAt: new Date().toISOString(),
      },
    })),
  };
}

// Starts an in-browser simulation and calls `onUpdate` with a GeoJSON
// FeatureCollection every `intervalMs`. Returns a `stop()` function.
function startMockFeed(onUpdate, intervalMs = 4000) {
  const state = Object.fromEntries(
    SENSOR_SITES.map((site) => [site.id, 40 + Math.random() * 80])
  );

  onUpdate(toFeatureCollection(state));

  const timer = setInterval(() => {
    for (const site of SENSOR_SITES) {
      state[site.id] = randomWalk(state[site.id], 5, 280, 25);
    }
    onUpdate(toFeatureCollection(state));
  }, intervalMs);

  return () => clearInterval(timer);
}

// Copia de METRO_STATIONS con un campo "primaryLine" extra (la primera de
// sus "lines") en cada estación — así metroLineExpression() puede colorear
// cada punto por línea con un simple ["match", ["get","primaryLine"], ...],
// sin depender de que Mapbox soporte comparar contra un array.
const METRO_STATIONS_WITH_PRIMARY_LINE = {
  ...METRO_STATIONS,
  features: METRO_STATIONS.features.map((f) => ({
    ...f,
    properties: { ...f.properties, primaryLine: f.properties.lines[0] },
  })),
};

const STUDIO_STYLE_URL = "mapbox://styles/luisatvaras/cmuoj9m0x008b01s7dvps8y4s"; // "Dark 2D" (2026-09-30; antes "Faded" cmuheoka3009z01qo23wmetb2 y cmuhecyz3009v01qodir63i20)
// Mapa base con el que abre la página (el nombre de una variante, o null

const DEFAULT_BASEMAP_VARIANT = "studio";

// son el mismo color, la vegetación natural (monte, matorral, pastizal,

// Relieve 3D. TERRAIN_EXAGGERATION: 1 = altura real; más alto marca más los
// cerros, pero también agranda los "escalones" de los cerros lejanos.
const TERRAIN_EXAGGERATION = 1.2;

// Sin niebla (Luisa, 2026-09-30, con el mapa base oscuro "Faded"): antes
// había una niebla blanca en el horizonte (HORIZON_FOG), que sobre el mapa
// oscuro hacía una franja clara. Sin niebla, detrás del terreno se ve el
// fondo de #map (gris claro, no negro) y, con la cámara muy inclinada, el
// terreno termina en una línea recta en el horizonte.

// Al encontrar la ubicación, los botones de la intro (selector de ciudad,
// botón de ubicación y aviso "Haz clic para…") y el fondo del panel toman el
// color fijo de la categoría del sensor más cercano (AQI_LEVELS, ver updateLocationColor).
// LOCATION_TEXT_DARK_ABOVE: si la luminosidad del color (0 = negro, 1 =
// blanco) pasa de esto, el texto encima va oscuro en vez de blanco (p. ej.
// sobre amarillo).
const LOCATION_TEXT_DARK_ABOVE = 0.6;
// Tono oscuro del aviso "Haz clic para…" y del texto del botón de ubicación:
// el azul marino del logo (#222855) con el matiz del color del sensor más
// cercano. (El logo ya no está en la página desde 2026-09-30.)
const LOGO_COLORS = ["#5d9ef0", "#222855"]; // [claro, oscuro]; solo se usa el oscuro
// Cursor del mouse: flecha rellena del color del sensor más cercano (azul
// --intro-accent al abrir), con borde blanco. Punta en CURSOR_HOTSPOT.
const CURSOR_HOTSPOT = [3, 2];
// El contorno de la flecha es el mismo color, más saturado y un poco más
// oscuro (antes blanco): CURSOR_OUTLINE_SATURATE / CURSOR_OUTLINE_DARKEN.
const CURSOR_OUTLINE_SATURATE = 0.25; // se suma a la saturación (0 a 1)
const CURSOR_OUTLINE_DARKEN = 0.15; // se resta a la claridad (0 a 1)
function cursorOutline(color) {
  const [h, s, l] = rgbToHsl(...hexToRgb01(color));
  return hslCss(h, [Math.min(1, s + CURSOR_OUTLINE_SATURATE), Math.max(0, l - CURSOR_OUTLINE_DARKEN)]);
}
function arrowCursorCss(color, outline = cursorOutline(color)) {
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"><path d="M3 2 L3 19 L7.5 14.8 L10.6 21.6 L13.6 20.3 L10.5 13.6 L16.6 13.6 Z" fill="${color}" stroke="${outline}" stroke-width="1.5" stroke-linejoin="round"/></svg>`;
  return `url("data:image/svg+xml,${encodeURIComponent(svg)}") ${CURSOR_HOTSPOT[0]} ${CURSOR_HOTSPOT[1]}, auto`;
}
// Al abrir (sin ubicación todavía): flecha blanca con contorno oscuro.
document.documentElement.style.setProperty("--location-cursor", arrowCursorCss("#ffffff", "#1f1f1f"));

// mapa, abajo. Más zoom = más cerca.
// Centro de los sensores (-100.2721, 25.6935), con el mapa bajado ~18 px a
// zoom 11 (2026-10-01, Luisa) para que la nube bajo "sensor por sensor"
// quede entre el título y el párrafo, en una pantalla de 1920 px.
const INTRO_CENTER = [-100.2721, 25.6991];
const INTRO_ZOOM = 11;
// SIMULATED_LOCATION: coordenada que "Mi ubicación" finge obtener (centro de
// Monterrey). Cámbiala para probar otros sensores cercanos.
const SIMULATED_LOCATION = { lng: -100.3161, lat: 25.6866 };
// Tiempos de la secuencia, en milisegundos.
const INTRO_LOCATING_MS = 1200; // "Obteniendo tu ubicación…" (mínimo; ahí se precalienta el 3D)
const INTRO_FLY_MS = 4000; // acercamiento de la vista inicial a los sensores
// Margen (px) alrededor de los sensores al encuadrar la ciudad tras el vuelo.
const INTRO_CITY_PADDING_PX = 80;

const map = new mapboxgl.Map({
  container: "map",
  style: MAP_STYLE,
  config: { basemap: STANDARD_CONFIG },
  // Abre con Monterrey en 2D (pantalla de inicio "MiAire"); el botón
  // "Mi ubicación" acerca a los sensores (ver startIntroSequence).
  center: INTRO_CENTER,
  zoom: INTRO_ZOOM,
  // Plano siempre (Standard usa el globo por defecto al alejarse).
  projection: "mercator",
  pitch: 0, // abre en vista 2D (ver is3DMode)
  bearing: 0,
  antialias: true,
});

map.addControl(new mapboxgl.NavigationControl({ visualizePitch: true }), "top-right");
tintNavIcons();

// Íconos de +, − y norte del color de la ubicación: la imagen gris de Mapbox
// se usa como máscara y se pinta con background-color (ver style.css).
function tintNavIcons() {
  for (const icon of document.querySelectorAll("#map .mapboxgl-ctrl-group .mapboxgl-ctrl-icon")) {
    const image = getComputedStyle(icon).backgroundImage;
    if (!image || image === "none") continue;
    icon.style.webkitMaskImage = image;
    icon.style.maskImage = image;
    icon.style.backgroundImage = "none";
    icon.classList.add("tinted");
  }
}

// --- Nubes 2D y halo: uno se convierte en el otro ---------------------------
// CLOUD_2D_MIN_ZOOM: umbral. Más cerca se ven las nubes 2D; al alejarse más
// allá, las nubes se desvanecen y en su lugar "florece" el halo de su mismo
// color (mapa de calor). El halo nunca se ve por encima de este zoom.
// (El zoom actual se muestra en la línea de estado del panel.)
const CLOUD_2D_MIN_ZOOM = 10;
// CLOUD_HALO_SWAP_MS: duración de la animación nube <-> halo.
const CLOUD_HALO_SWAP_MS = 900;
// HALO_OPACITY: opacidad del halo una vez que aparece.
const HALO_OPACITY = 0.35;
// HALO_RADIUS_BY_ZOOM: radio en píxeles de pantalla, pares [zoom, radio].
const HALO_RADIUS_BY_ZOOM = [6, 40, 10, 45];
// HALO_BLUR: 0 = borde duro, 1 = totalmente difuminado.
const HALO_BLUR = 1;
// HALO_MIN_ZOOM: más lejos que esto (país / planeta) el halo tampoco se ve —
// si no, en el globo de la intro los 66 halos se juntan en una mancha.
const HALO_MIN_ZOOM = 6;

let showHalo = true; // el botón "Halo" lo apaga del todo; si está encendido, aparece solo al alejarse

// true tras la primera vez que corre initializeStyle() — algunas cosas
// (listeners, el feed de datos simulados) deben quedar armadas una sola
// vez; el resto (capas, fuentes, terreno) se vuelve a montar en cada
// "style.load".
let oneTimeSetupDone = false;
let lastSensorCollection = null; // para repoblar sensores al instante tras un cambio de estilo

function initializeStyle() {
  map.addSource("mapbox-dem", {
    type: "raster-dem",
    url: "mapbox://mapbox.mapbox-terrain-dem-v1",
    tileSize: 512,
    maxzoom: 14,
  });
  map.setTerrain({ source: "mapbox-dem", exaggeration: TERRAIN_EXAGGERATION });
  map.setFog(null);

  // Velo de color del estilo de Studio (su capa "background", ver
  // updateStudioTint). Va primero: queda encima del mapa base (calles y
  // nombres incluidos, como en Studio) y debajo de metro, halos y nubes.
  map.addLayer(studioTintLayer);

  // Líneas y estaciones reales del Metrorrey (datos de OpenStreetMap, ver
  // scripts/fetch_metro.py). El color de cada línea sale de la propia data
  // (["get","color"]), así que basta con actualizar metro.js si cambian.
  map.addSource("metro-lines", { type: "geojson", data: METRO_LINES });
  map.addLayer({
    id: "metro-lines-layer",
    type: "line",
    source: "metro-lines",
    layout: { "line-cap": "round", "line-join": "round" },
    paint: {
      "line-color": metroLineExpression("color"),
      "line-width": 4,
      "line-opacity": metroLineExpression("opacity"),
    },
  });

  map.addSource("metro-stations", { type: "geojson", data: METRO_STATIONS_WITH_PRIMARY_LINE });
  map.addLayer({
    id: "metro-stations-layer",
    type: "circle",
    source: "metro-stations",
    paint: {
      "circle-radius": 2,
      // Si la estación es de varias líneas, toma el color de la primera
      // (primaryLine) — no hay forma de pintar un círculo con dos colores.
      "circle-color": metroLineExpression("color", "primaryLine"),
      "circle-stroke-width": 1.2,
      "circle-stroke-color": metroLineExpression("color", "primaryLine"),
    },
  });
  map.addLayer({
    id: "metro-stations-label",
    type: "symbol",
    source: "metro-stations",
    minzoom: 13,
    layout: {
      "text-field": ["get", "name"],
      "text-size": 11,
      "text-offset": [0, 1.1],
      "text-anchor": "top",
      visibility: "none", // escondida por ahora a pedido — quita esta línea para reactivarla
    },
    paint: {
      "text-color": "#ffffff",
      "text-halo-color": "#000000",
      "text-halo-width": 1,
    },
  });

  // Vegetación y parques del color de la tierra (ver FLAT_LAND_VARIANTS).
  // Van en el slot "bottom" antes del sombreado, así el relieve queda encima.
  map.addSource("flat-landcover", { type: "vector", url: "mapbox://mapbox.mapbox-terrain-v3" });
  map.addSource("flat-streets", { type: "vector", url: "mapbox://mapbox.mapbox-streets-v8" });
  const flatLandPaint = {
    "fill-color": "#000000", // lo pone updateFlatLand() con el colorLand del mapa base
    // Misma luz que la tierra de Standard (su capa "land"), para que el mismo
    // color se vea igual.
    "fill-emissive-strength": ["interpolate", ["linear"], ["zoom"], 13, 0.1, 14, 0.25],
    "fill-antialias": false,
  };
  map.addLayer({
    id: "flat-landcover",
    type: "fill",
    slot: "bottom",
    source: "flat-landcover",
    "source-layer": "landcover",
    layout: { visibility: "none" },
    // Standard desvanece su vegetación entre zoom 10 y 12: igual aquí.
    paint: { ...flatLandPaint, "fill-opacity": ["interpolate", ["linear"], ["zoom"], 10, 1, 12, 0] },
  });
  map.addLayer({
    id: "flat-park",
    type: "fill",
    slot: "bottom",
    source: "flat-streets",
    "source-layer": "landuse_overlay",
    filter: ["==", ["get", "class"], "national_park"],
    layout: { visibility: "none" },
    paint: flatLandPaint,
  });
  updateFlatLand();

  // Sombreado del relieve (colores en HILLSHADE, colors.js). Fuente propia:
  // Mapbox recomienda no compartir la del terreno 3D.
  map.addSource("hillshade-dem", {
    type: "raster-dem",
    url: "mapbox://mapbox.mapbox-terrain-dem-v1",
    tileSize: 512,
    maxzoom: 14,
  });
  // Entre HILLSHADE.zooms[0] (país) y [1] (ciudad) pasa de los valores
  // "country" a los "city".
  const byZoom = (key) => ["interpolate", ["linear"], ["zoom"], HILLSHADE.zooms[0], HILLSHADE.country[key], HILLSHADE.zooms[1], HILLSHADE.city[key]];
  map.addLayer({
    id: "hillshade-layer",
    type: "hillshade",
    slot: "bottom",
    source: "hillshade-dem",
    paint: {
      "hillshade-shadow-color": byZoom("shadow"),
      "hillshade-highlight-color": byZoom("highlight"),
      "hillshade-accent-color": byZoom("accent"),
      "hillshade-exaggeration": byZoom("exaggeration"),
    },
  });
  updateHillshadeForVariant();

  map.addSource("sensors", {
    type: "geojson",
    data: { type: "FeatureCollection", features: [] },
  });

  // Halo de color bajo cada sensor, del color de su AQI. Solo aparece al
  // alejar el zoom: los halos vecinos se mezclan y la ciudad se lee como un
  // mapa de calor. Ajustes en HALO_* (arriba de initializeStyle).
  map.addLayer({
    id: "sensor-base",
    type: "circle",
    source: "sensors",
    minzoom: HALO_MIN_ZOOM,
    paint: {
      "circle-color": aqiGradientExpression(),
      "circle-radius": ["interpolate", ["linear"], ["zoom"], ...HALO_RADIUS_BY_ZOOM],
      // La opacidad la cambia updateCloudHaloSwap() según el zoom; el
      // "-transition" hace que aparezca/desaparezca animado, y el delay que
      // florezca justo mientras la nube se va.
      "circle-opacity": map.getZoom() < CLOUD_2D_MIN_ZOOM ? HALO_OPACITY : 0, // nace ya en su estado (sin animar)
      "circle-opacity-transition": { duration: CLOUD_HALO_SWAP_MS, delay: CLOUD_HALO_SWAP_MS / 3 },
      "circle-blur": HALO_BLUR,
      "circle-pitch-alignment": "map", // acostado sobre el suelo, no de frente a la cámara
    },
  });

  map.addLayer(sensorColumnsLayer);

  // Nubes 2D: los dibujos de FIGURAS/miaire_nubes_tipos.svg (rellena o
  // contorno según cloudStyle del sensor) en los 5 colores fijos de
  // categoría (AQI_LEVELS): un ícono por estilo y color, "cloud-filled-0"…
  for (const style of CLOUD_STYLES) {
    AQI_LEVELS.forEach((level, i) => {
      const id = `cloud-${style}-${i}`;
      if (!map.hasImage(id)) map.addImage(id, drawCloudIcon(style, level.color), { pixelRatio: 2 });
    });
    // Pantalla de inicio: nubes neutras, sin el color de la calidad del aire
    // (ver INTRO_CLOUD_COLORS). "cloud-filled-intro", "cloud-outline-intro".
    const introId = `cloud-${style}-intro`;
    if (!map.hasImage(introId)) map.addImage(introId, drawCloudIcon(style, INTRO_CLOUD_COLORS[style]), { pixelRatio: 2 });
  }
  // Círculo de color detrás del sensor más cercano (ver FOCUS_CIRCLE_*).
  map.addLayer({
    id: "sensor-focus",
    type: "circle",
    source: "sensors",
    filter: ["==", ["get", "id"], ""],
    layout: { visibility: "none" },
    paint: {
      "circle-color": aqiLevelColorExpression(),
      "circle-opacity": FOCUS_CIRCLE_OPACITY,
      "circle-radius": FOCUS_CIRCLE_RADIUS_PX,
      "circle-pitch-alignment": "viewport",
      "circle-emissive-strength": 1,
    },
  });
  map.addLayer({
    id: "sensor-cloud-2d",
    type: "symbol",
    source: "sensors",
    layout: {
      "icon-image": cloudIconExpression(),
      "icon-size": 0.3,
      "icon-allow-overlap": true,
      visibility: "none", // el toggle lo activa al entrar a modo 2D
    },
    paint: {
      // Nace ya en el estado del zoom actual — si naciera visible, al abrir
      // la página (planeta, muy lejos) se veía una nube que se desvanecía.
      // Después la cambia updateCloudHaloSwap() según el zoom.
      "icon-opacity": map.getZoom() < CLOUD_2D_MIN_ZOOM ? 0 : 1,
      "icon-opacity-transition": { duration: CLOUD_HALO_SWAP_MS },
    },
  });

  buildLegend();
  buildMetroLegend();

  // El feed de datos y los listeners de eventos (popups, botones) solo se
  // arman una vez — re-armarlos en cada cambio de estilo duplicaría
  // popups/intervalos, no los reemplazaría.
  if (!oneTimeSetupDone) {
    oneTimeSetupDone = true;
    setupMagnifier();
    setupCloudLabel();
    wirePopups();
    wireMetroPopups();
    wireViewToggle();
    wireVariantToggles();
    wireCloudToggle();
    wireHaloToggle();
    wireMetroToggle();
    wireColumnToggle();
    wireShapeToggle();

    startMockFeed((collection) => {
      lastSensorCollection = collection;
      applySensorUpdate(collection);
    });
  } else if (lastSensorCollection) {
    // La fuente "sensors" es nueva (el estilo se acaba de recargar) — hay
    // que repoblarla ya, no esperar al próximo tick del feed.
    applySensorUpdate(lastSensorCollection);
  }

  // Re-aplica el modo 2D/3D actual sobre las capas recién montadas — sin
  // esto, cambiar de estilo siempre "resetearía" a la vista 3D por defecto.
  setViewMode(is3DMode);
  setMetroVisible(showMetro);
  updateCloudHaloSwap(true); // capas recién montadas: aplica el estado del zoom actual
}

function applySensorUpdate(collection) {
  map.getSource("sensors").setData(collection);
  updateColumnMeshes(collection);
  updateLocationColor(collection);
  lastUpdateTime = new Date().toLocaleTimeString();
  updateStatus();
}

map.on("style.load", initializeStyle);

// Línea de estado del panel: hora de la última lectura + zoom actual (para
// poder elegir a ojo valores como CLOUD_2D_MIN_ZOOM o los del halo).
let lastUpdateTime = null;

function updateStatus() {
  const time = lastUpdateTime ? ` — ${lastUpdateTime}` : "";
  document.getElementById("status").textContent = `En vivo (datos simulados)${time} · zoom ${map.getZoom().toFixed(1)}`;
}
map.on("zoom", updateStatus);

// Nube 2D <-> halo según el zoom (ver CLOUD_2D_MIN_ZOOM). Solo actúa al
// cruzar el umbral; la transición de Mapbox anima el cambio.
let haloZoneActive = null; // true = lejos (halo), false = cerca (nubes); null = sin aplicar aún

function updateCloudHaloSwap(force = false) {
  const far = map.getZoom() < CLOUD_2D_MIN_ZOOM;
  if (far === haloZoneActive && !force) return;
  haloZoneActive = far;
  if (map.getLayer("sensor-cloud-2d")) map.setPaintProperty("sensor-cloud-2d", "icon-opacity", cloudOpacity(far));
  if (map.getLayer("sensor-base")) map.setPaintProperty("sensor-base", "circle-opacity", far ? HALO_OPACITY : 0);
}
map.on("zoom", () => updateCloudHaloSwap());

// --- Color de los botones según el sensor más cercano ----------------------
// Mientras no haya ubicación, los botones quedan en el azul --intro-accent.
let userLngLat = null; // la pone "Mi ubicación" (simulada, ver SIMULATED_LOCATION)
let nearestSensorId = null; // sensor más cercano a userLngLat (lo pone updateLocationColor)
// En la pantalla de inicio, ya con ubicación: las nubes que no son el sensor
// más cercano se ven a esta opacidad (el más cercano, al 100%).
const INTRO_OTHER_CLOUDS_OPACITY = 0.2;
// Círculo detrás del sensor más cercano (pantalla de inicio): mismo color de
// su categoría, a esta opacidad, y este radio en píxeles.
const FOCUS_CIRCLE_OPACITY = 0.16;
const FOCUS_CIRCLE_RADIUS_PX = 34;

// Opacidad de las nubes 2D: 0 lejos (se ve el halo); en la intro con
// ubicación, resalta el sensor más cercano; si no, todas al 100%.
function cloudOpacity(far) {
  if (far) return 0;
  if (introActive && nearestSensorId) {
    return ["case", ["==", ["get", "id"], nearestSensorId], 1, INTRO_OTHER_CLOUDS_OPACITY];
  }
  return 1;
}
// --- Tarjeta del sensor detectado ("Ahora mismo el aire está…") -------------
// Diseño: FIGURAS/sensor aire highlight_sin_monito.svg (tarjeta de 253 x 175,
// una por categoría con su monito). Aparece en la pantalla de inicio junto
// al círculo del sensor más cercano (arriba a la derecha), igual que él.
// SENSOR_CARD_WIDTH: ancho en px (el alto sale de la proporción del diseño).
// SENSOR_CARD_OFFSET: [derecha, arriba] en px desde el centro del sensor
// hasta la esquina inferior izquierda de la tarjeta.
const SENSOR_CARD_WIDTH = 270;
// Del diseño "sensor aire highlight.svg": la esquina inferior izquierda de
// la tarjeta queda a 0.40 del radio del círculo a la derecha y 0.51 arriba
// de su centro (21.4 y 27.4 con radio 53.5) → con radio 34 ≈ [14, 17] px.
const SENSOR_CARD_OFFSET = [14, 17];
let sensorCardEl = null;
let sensorCardKey = null; // qué muestra ahora (para no rehacerla en cada lectura)
const placeNames = {}; // id del sensor -> "Colonia, Municipio" (Mapbox, una vez por sensor)

// "Muy malo" -> "Muy Malo", como en el diseño.
const titleCase = (text) => text.replace(/(^|\s)(\S)/g, (m, sp, ch) => sp + ch.toUpperCase());

function updateSensorCard() {
  if (!sensorCardEl) {
    sensorCardEl = document.createElement("div");
    sensorCardEl.id = "sensor-card";
    sensorCardEl.setAttribute("aria-live", "polite");
    document.body.append(sensorCardEl);
  }
  const feature = introActive && nearestSensorId && !is3DMode
    ? lastSensorCollection?.features.find((f) => f.properties.id === nearestSensorId)
    : null;
  if (!feature) {
    sensorCardEl.classList.remove("visible");
    return;
  }
  const { id, name, aqi } = feature.properties;
  const level = levelForAqi(aqi);
  const index = AQI_LEVELS.indexOf(level);
  const key = `${id}|${index}|${aqi}|${placeNames[id] || ""}`;
  if (key !== sensorCardKey) {
    sensorCardKey = key;
    renderSensorCard(feature, level, index);
  }
  if (placeNames[id] === undefined) lookUpPlace(id, feature.geometry.coordinates);
  placeSensorCard();
  sensorCardEl.classList.add("visible");
}

function renderSensorCard(feature, level, index) {
  const { id, name, aqi } = feature.properties;
  const monito = MONITOS[index];
  const el = sensorCardEl;
  el.style.setProperty("--card-color", level.color);
  el.style.width = `${SENSOR_CARD_WIDTH}px`;
  el.style.setProperty("--u", `${SENSOR_CARD_WIDTH / 253}px`);
  el.innerHTML = `
    <div class="sc-name"></div>
    <div class="sc-place"></div>
    <div class="sc-title">Ahora mismo<br><strong>el aire está</strong></div>
    <div class="sc-pill"></div>
    <div class="sc-value"><span class="sc-info" aria-hidden="true">i</span><span></span></div>
    <img class="sc-monito" alt="">`;
  const label = /^sensor\b/i.test(name) ? name : `Sensor ${name}`;
  el.querySelector(".sc-name").textContent = label;
  el.querySelector(".sc-name").title = label;
  el.querySelector(".sc-place").textContent = placeNames[id] || "";
  el.querySelector(".sc-pill").textContent = titleCase(level.label);
  // No hay PM2.5 todavía: se muestra el índice AQI (simulado) del sensor.
  el.querySelector(".sc-value span:last-child").textContent = `Índice AQI · ${aqi}`;
  const img = el.querySelector(".sc-monito");
  img.src = monito.src;
  const [x, y, w] = monito.box;
  img.style.left = `${(x / 253) * 100}%`;
  img.style.top = `${(y / 175) * 100}%`;
  img.style.width = `${(w / 253) * 100}%`;
}

// Junto al sensor: arriba a la derecha de su círculo; si no cabe, del otro lado.
function placeSensorCard() {
  if (!sensorCardEl || !sensorCardEl.classList.contains("visible") && !nearestSensorId) return;
  const feature = lastSensorCollection?.features.find((f) => f.properties.id === nearestSensorId);
  if (!feature) return;
  const point = map.project(feature.geometry.coordinates);
  const w = SENSOR_CARD_WIDTH;
  const h = w * (175 / 253);
  let left = point.x + SENSOR_CARD_OFFSET[0];
  let top = point.y - SENSOR_CARD_OFFSET[1] - h;
  if (left + w > window.innerWidth - 12) left = point.x - SENSOR_CARD_OFFSET[0] - w;
  if (top < 12) top = point.y + SENSOR_CARD_OFFSET[1];
  sensorCardEl.style.left = `${left}px`;
  sensorCardEl.style.top = `${top}px`;
}
map.on("move", () => {
  if (sensorCardEl?.classList.contains("visible")) placeSensorCard();
});

// Colonia y municipio del sensor (búsqueda inversa de Mapbox, una vez).
async function lookUpPlace(id, [lng, lat]) {
  placeNames[id] = ""; // en curso: no repetir
  try {
    const url = `https://api.mapbox.com/search/geocode/v6/reverse?longitude=${lng}&latitude=${lat}&types=neighborhood,locality,place&language=es&access_token=${mapboxgl.accessToken}`;
    const data = await (await fetch(url)).json();
    const props = (data.features || []).map((f) => f.properties);
    const pick = (type) => props.find((p) => p.feature_type === type)?.name;
    const barrio = pick("neighborhood") || pick("locality");
    const city = pick("place") || props[0]?.context?.place?.name;
    placeNames[id] = [barrio, city].filter(Boolean).join(", ");
  } catch {
    placeNames[id] = "";
  }
  updateSensorCard();
}

// Reaplica ícono (gris o de color) y opacidad de las nubes 2D, y el círculo
// detrás del sensor más cercano.
function refreshClouds() {
  if (map.getLayer("sensor-focus")) {
    const on = introActive && nearestSensorId && !is3DMode;
    map.setFilter("sensor-focus", ["==", ["get", "id"], nearestSensorId || ""]);
    map.setLayoutProperty("sensor-focus", "visibility", on ? "visible" : "none");
  }
  updateSensorCard();
  if (!map.getLayer("sensor-cloud-2d")) return;
  map.setLayoutProperty("sensor-cloud-2d", "icon-image", cloudIconExpression());
  map.setPaintProperty("sensor-cloud-2d", "icon-opacity", cloudOpacity(map.getZoom() < CLOUD_2D_MIN_ZOOM));
}


// Distancia en km sobre la esfera terrestre (haversine).
function distanceKm(a, b) {
  const toRad = Math.PI / 180;
  const dLat = (b.lat - a.lat) * toRad;
  const dLng = (b.lng - a.lng) * toRad;
  const h = Math.sin(dLat / 2) ** 2 + Math.cos(a.lat * toRad) * Math.cos(b.lat * toRad) * Math.sin(dLng / 2) ** 2;
  return 12742 * Math.asin(Math.sqrt(h));
}

function updateLocationColor(collection) {
  if (!userLngLat) return;
  const reference = userLngLat;
  let nearest = null;
  let nearestKm = Infinity;
  for (const feature of collection.features) {
    const [lng, lat] = feature.geometry.coordinates;
    const km = distanceKm(reference, { lng, lat });
    if (km < nearestKm) {
      nearestKm = km;
      nearest = feature;
    }
  }
  if (!nearest) return;
  if (nearest.properties.id !== nearestSensorId) {
    nearestSensorId = nearest.properties.id;
    refreshClouds(); // las nubes toman su color, junto con los botones
  } else {
    updateSensorCard(); // misma tarjeta, lectura nueva
  }
  // Solo los 5 colores fijos de la categoría (AQI_LEVELS), no el degradado.
  const levelColor = levelForAqi(nearest.properties.aqi).color;
  const [r, g, b] = hexToRgb01(levelColor);
  const luminance = 0.2126 * r + 0.7152 * g + 0.0722 * b;
  // Variables CSS de style.css: se actualizan en cada lectura (con transición).
  const root = document.documentElement.style;
  const rgb = `${Math.round(r * 255)}, ${Math.round(g * 255)}, ${Math.round(b * 255)}`;
  root.setProperty("--intro-accent", `rgb(${rgb})`);
  root.setProperty("--location-rgb", rgb); // fondo semitransparente del panel
  const darkText = luminance > LOCATION_TEXT_DARK_ABOVE;
  root.setProperty("--intro-on-accent", darkText ? "var(--intro-text)" : "#ffffff");
  root.setProperty("--location-cursor", arrowCursorCss(levelColor));

  // Aviso y texto del botón: tono oscuro con el matiz del mismo color fijo.
  const hue = rgbToHsl(r, g, b)[0];
  root.setProperty("--intro-accent-dark", hslCss(hue, rgbToHsl(...hexToRgb01(LOGO_COLORS[1])).slice(1)));
}

function hexToRgb01(hex) {
  const n = parseInt(hex.slice(1), 16);
  return [((n >> 16) & 255) / 255, ((n >> 8) & 255) / 255, (n & 255) / 255];
}

// [r, g, b] (0-1) -> [matiz 0-360, saturación 0-1, luminosidad 0-1]
function rgbToHsl(r, g, b) {
  const max = Math.max(r, g, b);
  const min = Math.min(r, g, b);
  const l = (max + min) / 2;
  if (max === min) return [0, 0, l];
  const d = max - min;
  const s = l > 0.5 ? d / (2 - max - min) : d / (max + min);
  const h = max === r ? (g - b) / d + (g < b ? 6 : 0) : max === g ? (b - r) / d + 2 : (r - g) / d + 4;
  return [h * 60, s, l];
}

function hslCss(hue, [s, l]) {
  return `hsl(${hue.toFixed(1)}, ${(s * 100).toFixed(1)}%, ${(l * 100).toFixed(1)}%)`;
}

// --- Dimensiones de la columna -------------------------------------------
// COLUMN_RADIUS_METERS: radio del cilindro y de la media esfera de la
// punta (su altura es igual a este radio — así el remate es un semicírculo
// real, nunca un óvalo).
const COLUMN_RADIUS_METERS = 50;
// COLUMN_RADIAL_SEGMENTS: lados alrededor del cilindro/domo (más = más
// liso; pocos se ve facetado/"estriado").
const COLUMN_RADIAL_SEGMENTS = 32;
// COLUMN_CAP_SEGMENTS: anillos que forman la curva de la media esfera
// (más = domo más suave).
const COLUMN_CAP_SEGMENTS = 12;
// --- Versión "pila de nubes" (botón "Columnas de nubes") ------------------
// La nube del SVG en plano, acostada, repetida hacia arriba; cada capa toma
// el color del degradado según su altura.
// STACK_CLOUD_WIDTH_METERS: ancho de cada nube de la pila.
const STACK_CLOUD_WIDTH_METERS = 110;
// STACK_SPACING_METERS: separación vertical entre una nube y la siguiente.
const STACK_SPACING_METERS = 45;
// STACK_CLOUD_THICKNESS_METERS: grosor de cada nube de la pila.
const STACK_CLOUD_THICKNESS_METERS = 5;
// STACK_HEIGHT_MULTIPLIER: cuántas veces más alta que la cápsula.
const STACK_HEIGHT_MULTIPLIER = 2.5;
// COLUMN_FLOAT_GAP_METERS: separación fija sobre el terreno — la columna
// flota, nunca toca el suelo (así el relieve real nunca la "corta").
const COLUMN_FLOAT_GAP_METERS = 40;
// --- Tamaño en pantalla al alejar la cámara (ver zoomBoost en render()) ---
// ZOOM_BOOST_REFERENCE: nivel de zoom en el que columnas/nube se ven a su
// tamaño "perfecto" (sin agrandar) — coincide con el zoom inicial del mapa.
const ZOOM_BOOST_REFERENCE = 12.2;
// ZOOM_BOOST_MAX: tope del agrandado al alejarse mucho (ej. ver la ciudad
// completa), para que sigan siendo visibles sin volverse gigantescas.
const ZOOM_BOOST_MAX = 6;
// ---------------------------------------------------------------------------

// Construye una cápsula real (cilindro + media esfera) para un sensor, con
// un color por vértice que sigue COLUMN_GRADIENT a lo largo de la altura.
// A diferencia de apilar prismas (fill-extrusion), esto es una sola
// superficie continua: no hay costuras ni z-fighting posible.
let columnShape = "stack"; // "round" (cápsula) | "stack" (pila de nubes) — al pasar a 3D se ve la pila

// La cápsula es geometría normal; la pila de nubes vive en su propio
// InstancedMesh (ver updateCloudStack), así que en ese modo la cápsula queda vacía.
function buildColumnGeometry(aqi) {
  if (columnShape === "stack") return new THREE.BufferGeometry();
  return buildCapsuleGeometry(aqi);
}

// Altura real de la columna según la forma actual (la pila es más alta).
function columnHeightFor(aqi) {
  return heightForAqi(aqi) * (columnShape === "stack" ? STACK_HEIGHT_MULTIPLIER : 1);
}

function buildCapsuleGeometry(aqi) {
  const totalHeight = heightForAqi(aqi);
  // Si la columna es más baja que el diámetro, el radio se encoge con ella
  // (no puede ser una media esfera más alta que la columna misma).
  const radius = Math.min(COLUMN_RADIUS_METERS, Math.max(totalHeight / 2, 1));
  const straightLength = Math.max(totalHeight - 2 * radius, 0);

  // La columna flota (ver COLUMN_FLOAT_GAP_METERS en render()), así que
  // los dos extremos redondeados de CapsuleGeometry quedan bien — nunca
  // tocan terreno real, no hay taper que "se corte" contra el relieve.
  const geometry = new THREE.CapsuleGeometry(radius, straightLength, COLUMN_CAP_SEGMENTS, COLUMN_RADIAL_SEGMENTS);
  geometry.translate(0, straightLength / 2 + radius, 0); // la punta inferior queda en y=0
  geometry.rotateX(Math.PI / 2); // "arriba" pasa de Y (Three.js) a Z (altitud en Mercator)
  return applyHeightGradient(geometry, aqi, totalHeight);
}

// Pila de nubes con INSTANCING: una nube delgada (contorno del SVG
// simplificado a STACK_CLOUD_OUTLINE_POINTS, extruido
// STACK_CLOUD_THICKNESS_METERS) que comparten todas las columnas de su estilo. Cada pila es
// un InstancedMesh que la repite en cada capa con su propio color — una sola
// llamada de dibujo por sensor, y ante una lectura nueva solo se mueven
// capas y colores (no se reconstruye geometría).
const STACK_CLOUD_OUTLINE_POINTS = 64;

// Una plantilla por estilo (ver cloudStyleFor): "filled" = la nube
// rellena; "outline" = un anillo con la forma de la nube (su borde, con el
// mismo grosor que las nubes 3D: CLOUD_TYPES_STROKE × CLOUD_3D_STROKE_SCALE).
// Contorno de FIGURAS/miaire_nubes_tipos.svg (CLOUD_TYPES_PATH_D).
const stackCloudTemplates = {};
function getStackCloudTemplate(style = "filled") {
  if (stackCloudTemplates[style]) return stackCloudTemplates[style];
  const box = CLOUD_TYPES_BOX;
  const cx = box.minX + box.width / 2;
  const cy = box.minY + box.height / 2;
  const points = sampleSvgPathPoints(CLOUD_TYPES_PATH_D, STACK_CLOUD_OUTLINE_POINTS);
  // El SVG crece hacia abajo; se voltea Y para que "arriba" quede arriba.
  const centered = points.map(([x, y]) => [x - cx, -(y - cy)]);
  const half = (CLOUD_TYPES_STROKE * CLOUD_3D_STROKE_SCALE) / 2;
  let shape;
  if (style === "outline") {
    // Borde exterior e interior: cada punto se mueve hacia afuera / adentro
    // de la nube la mitad del grosor del borde.
    const outer = offsetOutline(centered, half);
    const inner = offsetOutline(centered, -half);
    shape = new THREE.Shape(outer.map(([x, y]) => new THREE.Vector2(x, y)));
    shape.holes.push(new THREE.Path(inner.map(([x, y]) => new THREE.Vector2(x, y))));
  } else {
    shape = new THREE.Shape(offsetOutline(centered, half).map(([x, y]) => new THREE.Vector2(x, y)));
  }
  const geometry = new THREE.ExtrudeGeometry(shape, { depth: 1, bevelEnabled: false, curveSegments: 1 });
  const scale = STACK_CLOUD_WIDTH_METERS / box.width;
  // XY = plano horizontal de Mercator; la extrusión (Z) queda como el grosor.
  geometry.scale(scale, scale, STACK_CLOUD_THICKNESS_METERS);
  stackCloudTemplates[style] = geometry;
  return geometry;
}

// Mueve cada punto de un contorno cerrado `distance` unidades hacia afuera
// (negativo = hacia adentro), a lo largo de su normal.
function offsetOutline(points, distance) {
  let area = 0; // su signo dice si el contorno va en sentido horario o no
  points.forEach(([x1, y1], k) => {
    const [x2, y2] = points[(k + 1) % points.length];
    area += x1 * y2 - x2 * y1;
  });
  const outward = area > 0 ? 1 : -1;
  return points.map(([x, y], k) => {
    const [px, py] = points[(k - 1 + points.length) % points.length];
    const [nx, ny] = points[(k + 1) % points.length];
    const tx = nx - px;
    const ty = ny - py;
    const length = Math.hypot(tx, ty) || 1;
    return [x + (outward * distance * ty) / length, y - (outward * distance * tx) / length];
  });
}

// Máximo de capas que puede necesitar una pila (AQI más alto).
const STACK_MAX_LAYERS = Math.ceil((heightForAqi(500) * STACK_HEIGHT_MULTIPLIER) / STACK_SPACING_METERS) + 1;

// Acomoda las capas de una pila para su AQI: cuántas se dibujan, a qué
// altura y de qué color (el del degradado a esa altura).
const stackLayerMatrix = new THREE.Matrix4();
const stackLayerColor = new THREE.Color();

function updateCloudStack(stack, aqi) {
  const totalHeight = Math.max(heightForAqi(aqi) * STACK_HEIGHT_MULTIPLIER, 1);
  const topFraction = fractionForAqi(aqi);
  const layers = Math.min(STACK_MAX_LAYERS, Math.floor(totalHeight / STACK_SPACING_METERS) + 1);
  for (let k = 0; k < layers; k++) {
    const z = Math.min(k * STACK_SPACING_METERS, totalHeight);
    stack.setMatrixAt(k, stackLayerMatrix.makeTranslation(0, 0, z));
    const [r, g, b] = gradientRgbAt((z / totalHeight) * topFraction);
    stack.setColorAt(k, stackLayerColor.setRGB(r, g, b));
  }
  stack.count = layers;
  stack.instanceMatrix.needsUpdate = true;
  if (stack.instanceColor) stack.instanceColor.needsUpdate = true;
}

// Color por vértice que sigue COLUMN_GRADIENT a lo largo de la altura.
function applyHeightGradient(geometry, aqi, totalHeight) {
  const topFraction = fractionForAqi(aqi);
  const position = geometry.attributes.position;
  const colors = new Float32Array(position.count * 3);
  for (let i = 0; i < position.count; i++) {
    const heightFrac = Math.min(1, Math.max(0, position.getZ(i) / totalHeight));
    const [r, g, b] = gradientRgbAt(heightFrac * topFraction);
    colors[i * 3] = r;
    colors[i * 3 + 1] = g;
    colors[i * 3 + 2] = b;
  }
  geometry.setAttribute("color", new THREE.BufferAttribute(colors, 3));

  return geometry;
}

// --- Nube encima de cada columna --------------------------------------

// --- Nubes nuevas (FIGURAS/miaire_nubes_tipos.svg, 2026-09-30) ----------
// Dos estilos con el MISMO contorno: "filled" (relleno + borde) y "outline"
// (solo el borde). CLOUD_TYPES_PATH_D es el "d" de la nube verde rellena del
// SVG; CLOUD_TYPES_STROKE, el grosor de su borde en unidades del SVG. Si
// cambias el SVG, reemplaza estos dos valores.
const CLOUD_STYLES = ["filled", "outline"];
const CLOUD_TYPES_PATH_D =
  "M313.66,527.7c27.54,0,49.87-22.32,49.87-49.87s-22.33-49.87-49.87-49.87c-7.7,0-14.95,1.8-21.46,4.91-8.48-32.55-37.99-56.61-73.19-56.61-32.02,0-59.34,19.9-70.41,47.99-9.18-6.37-20.31-10.13-32.33-10.13-31.36,0-56.79,25.42-56.79,56.79s25.43,56.79,56.79,56.79h197.39Z";
const CLOUD_TYPES_STROKE = 12.5;
// CLOUD_3D_STROKE_SCALE: grosor del borde de las nubes 3D respecto al SVG.
// En 3D la nube se ve chica (~40 px) y con el borde original (1) las de
// contorno casi desaparecen. Más alto = borde más grueso.
const CLOUD_3D_STROKE_SCALE = 2;
// Caja de la nube (con su borde) en unidades del SVG: se mide una vez.
const CLOUD_TYPES_BOX = (() => {
  const points = sampleSvgPathPoints(CLOUD_TYPES_PATH_D, 400);
  const xs = points.map(([x]) => x);
  const ys = points.map(([, y]) => y);
  const half = (CLOUD_TYPES_STROKE * CLOUD_3D_STROKE_SCALE) / 2; // cabe también el borde más grueso del 3D
  const minX = Math.min(...xs) - half;
  const minY = Math.min(...ys) - half;
  return { minX, minY, width: Math.max(...xs) + half - minX, height: Math.max(...ys) + half - minY };
})();

// Dibuja la nube de un estilo y color en un canvas de `widthPx` de ancho.
// strokeScale: multiplica el grosor del borde (1 = el del SVG).
function drawCloudCanvas(style, color, widthPx, strokeScale = 1) {
  const scale = widthPx / CLOUD_TYPES_BOX.width;
  const canvas = document.createElement("canvas");
  canvas.width = widthPx;
  canvas.height = Math.ceil(CLOUD_TYPES_BOX.height * scale);
  const ctx = canvas.getContext("2d");
  ctx.scale(scale, scale);
  ctx.translate(-CLOUD_TYPES_BOX.minX, -CLOUD_TYPES_BOX.minY);
  const path = new Path2D(CLOUD_TYPES_PATH_D);
  ctx.lineWidth = CLOUD_TYPES_STROKE * strokeScale;
  ctx.lineJoin = "round";
  ctx.lineCap = "round";
  ctx.strokeStyle = color;
  if (style === "filled") {
    ctx.fillStyle = color;
    ctx.fill(path);
  }
  ctx.stroke(path);
  return canvas;
}

// Ancho del ícono 2D en píxeles lógicos (en pantalla lo multiplica
// "icon-size" de la capa sensor-cloud-2d).
const CLOUD_ICON_WIDTH_PX = 128;

// Ícono 2D (pixelRatio 2: el doble de resolución para que el borde se vea nítido).
function drawCloudIcon(style, color) {
  const canvas = drawCloudCanvas(style, color, CLOUD_ICON_WIDTH_PX * 2);
  return canvas.getContext("2d").getImageData(0, 0, canvas.width, canvas.height);
}

// Expresión de Mapbox: número de categoría ("0" = Bueno … "4" =
// Extremadamente malo) según el AQI, con los mismos cortes que AQI_LEVELS.
// Expresión de Mapbox: color fijo de la categoría (AQI_LEVELS) según el AQI.
function aqiLevelColorExpression() {
  const expression = ["step", ["get", "aqi"], AQI_LEVELS[0].color];
  AQI_LEVELS.slice(0, -1).forEach((level, i) => expression.push(level.max + 0.5, AQI_LEVELS[i + 1].color));
  return expression;
}
function aqiLevelIndexExpression() {
  const expression = ["step", ["get", "aqi"], "0"];
  AQI_LEVELS.slice(0, -1).forEach((level, i) => expression.push(level.max + 0.5, String(i + 1)));
  return expression;
}

// COLUMN_RADIUS_METERS y sus vecinas controlan la columna; estas de aquí
// abajo controlan solo la nube — edítalas para ajustar tamaño/volumen/gap.
const CLOUD_WIDTH_METERS = 300; // ancho real de la nube 3D (con su borde)
const CLOUD_GAP_METERS = 190; // separación entre la punta de la columna y la base de la nube
// Alto real de la nube en metros (eje vertical del SVG, ya escalado) — se
// usa para compensar la posición cuando crece por hover (ver CLOUD_HOVER_SCALE).
const CLOUD_HEIGHT_METERS = CLOUD_TYPES_BOX.height * (CLOUD_WIDTH_METERS / CLOUD_TYPES_BOX.width);

// Samplea un <path> SVG en una polilínea usando la propia API del navegador
// (getPointAtLength) — evita tener que escribir un parser de curvas Bézier
// a mano para interpretar el atributo "d".
function sampleSvgPathPoints(d, sampleCount) {
  const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
  path.setAttribute("d", d);
  const length = path.getTotalLength();
  const points = [];
  for (let i = 0; i < sampleCount; i++) {
    const { x, y } = path.getPointAtLength((i / sampleCount) * length);
    points.push([x, y]);
  }
  return points;
}

// Nube 3D = tarjeta plana y vertical con el dibujo de la nube (como la 2D),
// que en render() gira sobre su eje para verse siempre de frente: simula
// volumen sin serlo. Geometría compartida por todos los sensores; cada uno
// tiene su material (textura de su estilo + color de su categoría).
function buildCloudGeometry() {
  const geometry = new THREE.PlaneGeometry(CLOUD_WIDTH_METERS, CLOUD_HEIGHT_METERS);
  geometry.rotateX(Math.PI / 2); // de acostada a parada: el frente mira hacia -Y, "arriba" es Z
  return geometry;
}

// Textura en blanco de cada estilo; el material la tiñe con el color de la
// categoría (material.color), así bastan dos texturas para todos.
const cloudTextures = {};
function cloudTextureFor(style) {
  if (!cloudTextures[style]) {
    const texture = new THREE.CanvasTexture(drawCloudCanvas(style, "#ffffff", 512, CLOUD_3D_STROKE_SCALE));
    texture.anisotropy = 4;
    // Premultiplicada: al achicarse, el borde no se mezcla con el negro de
    // los píxeles transparentes (el contorno salía oscuro y apagado).
    texture.premultiplyAlpha = true;
    cloudTextures[style] = texture;
  }
  return cloudTextures[style];
}
// -----------------------------------------------------------------------

// Capa Mapbox GL "custom": dibuja mallas de Three.js (una cápsula + una
// nube por sensor) sobre el mismo contexto WebGL que usa el mapa. La
// posición de cada sensor es fija (SENSOR_SITES), así que su matriz de
// mundo se recalcula cada frame; la geometría de la columna y el color de
// la nube solo se actualizan cuando cambia el AQI (ver updateColumnMeshes).
const columnMeshes = {}; // site.id -> { mesh, lngLat }
const cloudMeshes = {}; // site.id -> { mesh, lngLat }
const columnHeights = {}; // site.id -> altura actual de la columna (metros)
let columnsRenderer, columnsScene, columnsCamera;
let render3DColumns = false; // el mapa abre en 2D; setViewMode(true) lo enciende sin desmontar la capa
let showClouds = true; // nubes 3D sobre las columnas: encendidas al pasar a 3D; el botón "Nubes" las apaga
let showColumns = true; // el botón "Ocultar columnas" las esconde, sea cual sea su forma
// columnsGrowth: altura de columnas y nubes 3D, de 0 (hundidas en el suelo)
// a 1 (normal). Solo baja durante la transición de 3D a 2D (leave3D).
let columnsGrowth = 1;

// site.id -> multiplicador de tamaño de su nube mientras el mouse está
// encima (ver wirePopups) — 1 (o ausente) es el tamaño normal.
const cloudHoverScale = {};
const CLOUD_HOVER_SCALE = 5;
// CLOUD_ROTATION_DEG: giro extra de las nubes 3D que flotan sobre las
// columnas, alrededor de su eje vertical. 0 = de frente, como la nube 2D
// (desde 2026-09-30 son tarjetas planas: con 180 se verían al revés, en
// espejo). Las pilas de nubes no lo usan: giran solas hacia la cámara.
const CLOUD_ROTATION_DEG = 0;

function mercatorDistance(a, b) {
  const dx = a.x - b.x;
  const dy = a.y - b.y;
  const dz = (a.z ?? 0) - (b.z ?? 0);
  return Math.sqrt(dx * dx + dy * dy + dz * dz);
}

const sensorColumnsLayer = {
  id: "sensor-columns-3d-layer",
  type: "custom",
  renderingMode: "3d",

  onAdd(mapInstance, gl) {
    columnsCamera = new THREE.Camera();
    columnsScene = new THREE.Scene();
    columnsScene.add(new THREE.AmbientLight(0xffffff, 0.9));
    const sunLight = new THREE.DirectionalLight(0xffffff, 0.35);
    sunLight.position.set(0, -70, 100);
    columnsScene.add(sunLight);

    // Si la nube falla al construirse, que se quede sin nube — nunca debe
    // tumbar las columnas (antes vivían en el mismo bloque sin protección,
    // así que un error acá dejaba a onAdd() a medias: sin columnMeshes, sin
    // columnsRenderer, y por tanto sin nada dibujándose en ningún frame).
    let sharedCloudGeometry = null;
    try {
      sharedCloudGeometry = buildCloudGeometry();
    } catch (err) {
      console.error("No se pudo construir la nube 3D; se omite.", err);
    }

    for (const site of SENSOR_SITES) {
      const lngLat = { lng: site.coords[0], lat: site.coords[1] };

      const columnMesh = new THREE.Mesh(
        new THREE.BufferGeometry(),
        // DoubleSide: las nubes planas de la pila se ven también desde abajo.
        new THREE.MeshBasicMaterial({ vertexColors: true, transparent: true, opacity: 0.85, side: THREE.DoubleSide })
      );
      columnMesh.matrixAutoUpdate = false;
      columnsScene.add(columnMesh);

      const stackMesh = new THREE.InstancedMesh(
        getStackCloudTemplate(cloudStyleFor(site.id)),
        new THREE.MeshBasicMaterial({ transparent: true, opacity: 0.85, side: THREE.DoubleSide }),
        STACK_MAX_LAYERS
      );
      stackMesh.count = 0; // se llena en updateColumnMeshes()
      stackMesh.matrixAutoUpdate = false;
      stackMesh.frustumCulled = false; // sus capas suben muy por encima de su esfera de recorte
      columnsScene.add(stackMesh);

      columnMeshes[site.id] = { mesh: columnMesh, stack: stackMesh, lngLat };

      if (sharedCloudGeometry) {
        const cloudMesh = new THREE.Mesh(
          sharedCloudGeometry,
          // Sin luces (MeshBasic): el color queda exacto, igual que en 2D.
          new THREE.MeshBasicMaterial({
            map: cloudTextureFor(cloudStyleFor(site.id)),
            color: 0xffffff,
            transparent: true,
            premultipliedAlpha: true,
            alphaTest: 0.05,
            depthWrite: false,
            side: THREE.DoubleSide,
          })
        );
        cloudMesh.matrixAutoUpdate = false;
        cloudMesh.visible = showClouds;
        columnsScene.add(cloudMesh);
        cloudMeshes[site.id] = { mesh: cloudMesh, lngLat };
      }
    }

    columnsRenderer = new THREE.WebGLRenderer({
      canvas: mapInstance.getCanvas(),
      context: gl,
      antialias: true,
    });
    columnsRenderer.autoClear = false;

    // Compila de una vez los shaders de columnas, pilas y nubes. Si no, se
    // compilan la primera vez que se dibujan — justo al pasar a 3D por
    // primera vez, y eso trababa la animación.
    columnsRenderer.compile(columnsScene, columnsCamera);
  },

  render(gl, matrix) {
    if (!render3DColumns) return; // modo 2D: no dibujar columnas ni nubes 3D

    columnsCamera.projectionMatrix = new THREE.Matrix4().fromArray(matrix);

    // A escala real, alejar la cámara para ver toda la ciudad encoge las
    // columnas a casi nada (son ~65m de radio contra ~40km de ciudad) — eso
    // es "correcto" pero las pierde de vista. zoomBoost las agranda al
    // alejarse más allá de ZOOM_BOOST_REFERENCE, sin tocarlas cuando el
    // zoom ya es igual o mayor (el nivel donde se ven "perfectas").
    const zoom = map.getZoom();
    const zoomBoost =
      zoom >= ZOOM_BOOST_REFERENCE ? 1 : Math.min(ZOOM_BOOST_MAX, 2 ** (ZOOM_BOOST_REFERENCE - zoom));

    const cameraPosition = map.getFreeCameraOptions().position;
    for (const { mesh, stack, lngLat } of Object.values(columnMeshes)) {
      // El terreno (DEM) carga después del primer frame y eleva el suelo
      // por encima de 0 — hay que anclar cada columna a la elevación real
      // del terreno en cada frame, o quedan enterradas bajo él.
      const elevation = map.queryTerrainElevation(lngLat) ?? 0;
      const mercator = mapboxgl.MercatorCoordinate.fromLngLat(lngLat, elevation + COLUMN_FLOAT_GAP_METERS);
      const scale = mercator.meterInMercatorCoordinateUnits() * zoomBoost;
      // Igual que las nubes flotantes: cada columna gira sobre su eje hacia
      // la cámara, así al rotar el mapa pirámides y pilas de nubes se ven
      // siempre del mismo lado (a la cápsula, que es redonda, no le afecta).
      const facingCamera = Math.atan2(cameraPosition.x - mercator.x, -(cameraPosition.y - mercator.y));
      mesh.matrix
        .makeTranslation(mercator.x, mercator.y, mercator.z)
        .scale(new THREE.Vector3(scale, scale, scale * columnsGrowth))
        .multiply(new THREE.Matrix4().makeRotationZ(facingCamera));
      stack.matrix.copy(mesh.matrix);
    }

    // Igual que en onAdd(): un error posicionando las nubes no debe impedir
    // que columnsRenderer.render() se llegue a ejecutar — si eso se salta,
    // NADA se dibuja ese frame (ni columnas ni nubes).
    try {
      // La nube solo se ve "de nube" (con sus lóbulos) de frente — de canto
      // siempre es un lente, sin importar qué tan gorda la hagamos (es
      // geometría 2D inflada, no un modelo 3D real). Así que la giramos
      // sobre su eje vertical para que su cara siempre apunte hacia la
      // posición REAL de la cámara 3D de Mapbox (no una aproximación por
      // bearing, que no pudimos verificar a ojo la primera vez).
      const canvas = map.getCanvas();

      // Hit-test manual: Mapbox no puede detectar hover sobre una capa
      // "custom" (las nubes son WebGL de Three.js), así que en vez de
      // escuchar el halo en el suelo, cada frame proyectamos la posición
      // de reposo (sin hover, para que la zona de detección no cambie
      // mientras la nube crece) de cada nube a pantalla y nos quedamos con
      // la más cercana al cursor que lo contenga.
      let hitId = null;
      let hitDist = Infinity;
      if (mouseCanvasX != null && !showClouds && showColumns) {
        // Sin nubes, el hover se detecta sobre la columna: el segmento de
        // pantalla entre su base y su punta, con un margen de su radio.
        for (const [id, { lngLat }] of Object.entries(columnMeshes)) {
          const elevation = map.queryTerrainElevation(lngLat) ?? 0;
          const bottomAlt = elevation + COLUMN_FLOAT_GAP_METERS;
          const topAlt = bottomAlt + (columnHeights[id] ?? 0) * zoomBoost;
          const bottomMercator = mapboxgl.MercatorCoordinate.fromLngLat(lngLat, bottomAlt);
          const bottom = projectMercatorToScreen(matrix, bottomMercator, canvas);
          const top = projectMercatorToScreen(matrix, mapboxgl.MercatorCoordinate.fromLngLat(lngLat, topAlt), canvas);
          const radiusMercator = bottomMercator.meterInMercatorCoordinateUnits() * zoomBoost * COLUMN_RADIUS_METERS;
          const side = projectMercatorToScreen(matrix, { ...bottomMercator, x: bottomMercator.x + radiusMercator }, canvas);
          const radius = Math.max(8, Math.hypot(side.x - bottom.x, side.y - bottom.y)); // mínimo 8px para poder atinarle
          const dist = distanceToSegment(mouseCanvasX, mouseCanvasY, bottom, top);
          if (dist <= radius && dist < hitDist) {
            hitDist = dist;
            hitId = id;
          }
        }
      }
      if (mouseCanvasX != null && showClouds) {
        for (const [id, { lngLat }] of Object.entries(cloudMeshes)) {
          const hitElevation = map.queryTerrainElevation(lngLat) ?? 0;
          const hitColumnTop = columnHeights[id] ?? 0;
          const hitAltitude = hitElevation + (hitColumnTop + CLOUD_GAP_METERS) * zoomBoost;
          const hitMercator = mapboxgl.MercatorCoordinate.fromLngLat(lngLat, hitAltitude);
          const hitScale = hitMercator.meterInMercatorCoordinateUnits() * zoomBoost;
          const center = projectMercatorToScreen(matrix, hitMercator, canvas);
          const edge = projectMercatorToScreen(
            matrix,
            { x: hitMercator.x + hitScale * (CLOUD_WIDTH_METERS / 2), y: hitMercator.y, z: hitMercator.z },
            canvas
          );
          const radius = Math.hypot(edge.x - center.x, edge.y - center.y);
          const dist = Math.hypot(mouseCanvasX - center.x, mouseCanvasY - center.y);
          if (dist <= radius && dist < hitDist) {
            hitDist = dist;
            hitId = id;
          }
        }
      }

      if (hitId !== hoveredSensorId) {
        if (hoveredSensorId) delete cloudHoverScale[hoveredSensorId];
        hoveredSensorId = hitId;
        canvas.style.cursor = hitId ? "pointer" : "";
        if (hitId) {
          cloudHoverScale[hitId] = CLOUD_HOVER_SCALE;
          showSensorPopup(hitId);
        } else {
          hideSensorPopup();
          hideCloudLabel();
        }
      }

      const camPos = map.getFreeCameraOptions().position;
      // Distancia de referencia: de la cámara al centro del mapa. Sirve
      // para normalizar el crecimiento por hover — sin esto, una nube
      // lejana (más chica en pantalla por perspectiva normal) crece menos
      // en píxeles que una cercana, aunque el multiplicador sea el mismo.
      const centerMercator = mapboxgl.MercatorCoordinate.fromLngLat(map.getCenter(), 0);
      const referenceDistance = mercatorDistance(camPos, centerMercator);

      for (const [id, { mesh, lngLat }] of Object.entries(cloudMeshes)) {
        const elevation = map.queryTerrainElevation(lngLat) ?? 0;
        const columnTop = (columnHeights[id] ?? 0) * columnsGrowth;
        const baseAltitude = elevation + (columnTop + CLOUD_GAP_METERS) * zoomBoost;

        // Qué tan lejos está ESTA nube de la cámara, respecto a la
        // distancia de referencia — más lejos que el centro = >1 (crece
        // más para compensar), más cerca = <1 (crece menos).
        const baseMercator = mapboxgl.MercatorCoordinate.fromLngLat(lngLat, baseAltitude);
        const distanceFactor = mercatorDistance(camPos, baseMercator) / referenceDistance;

        // El "extra" de tamaño al hacer hover (CLOUD_HOVER_SCALE - 1) se
        // multiplica por zoomBoost y por distanceFactor — si no, al alejar
        // el zoom (todo ya agrandado) o al estar lejos de cámara, un 5x
        // fijo apenas se nota en pantalla.
        const hoverScale = cloudHoverScale[id] ? 1 + (CLOUD_HOVER_SCALE - 1) * zoomBoost * distanceFactor : 1;
        // La nube crece desde su propio centro (queda armada así desde
