# Actualiza mexico_air.json (PM2.5, PM10, NO2 y ozono de México, CAMS vía Open-Meteo)
# cada 3 horas — el ritmo al que CAMS publica datos nuevos.
name: Calidad del aire México

on:
  schedule:
    - cron: "17 */3 * * *" # minuto 17 cada 3 horas (UTC)
  workflow_dispatch: # botón "Run workflow" en la pestaña Actions
  push:
    paths:
      - ".github/workflows/mexico-aq.yml"
      - "scripts/update_mexico_aq.py"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/update_mexico_aq.py
      - name: Commit si cambió
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mexico_air.json
          git diff --cached --quiet || (git commit -m "Actualiza calidad del aire de México" && git push)
